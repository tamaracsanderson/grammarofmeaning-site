<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>The Design Engine</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F1E4;--paper2:#EFE7D3;--fg:#24302A;--muted:#6E7669;--line:#C9BE9F;--card:#FFFDF6;
 --eng:#2C4A38;--sub:#3F7D57;--out:#C4602F;--honey:#E0A93B;--olive:#6E7B3A;--gold:#B08A3C;
 --serif:"Newsreader",ui-serif,Georgia,serif;--sans:"Inter",ui-sans-serif,system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media(prefers-color-scheme:dark){:root{--bg:#1B211D;--paper2:#232A25;--fg:#EDE7D8;--muted:#A6AEA3;--line:#3A423C;--card:#232A25;--eng:#4A7A5C;--sub:#5C9A72;--out:#D9793F;--honey:#E0A93B;--olive:#9CA86A;--gold:#c9a24e}}
:root[data-theme=dark]{--bg:#1B211D;--paper2:#232A25;--fg:#EDE7D8;--muted:#A6AEA3;--line:#3A423C;--card:#232A25;--eng:#4A7A5C;--sub:#5C9A72;--out:#D9793F;--honey:#E0A93B;--olive:#9CA86A;--gold:#c9a24e}
:root[data-theme=light]{--bg:#F6F1E4;--paper2:#EFE7D3;--fg:#24302A;--muted:#6E7669;--line:#C9BE9F;--card:#FFFDF6;--eng:#2C4A38;--sub:#3F7D57;--out:#C4602F;--honey:#E0A93B;--olive:#6E7B3A;--gold:#B08A3C}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--sans)}
.wrap{max-width:54rem;margin:0 auto;padding:26px 22px 30px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.topbar a{font-size:13px;color:var(--out);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--out) 40%,transparent)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
h1{font-family:var(--serif);font-size:clamp(28px,4.4vw,43px);font-weight:600;letter-spacing:-.01em;color:var(--eng);margin:0 0 12px;line-height:1.1}
.lede{font-family:var(--serif);font-size:17px;line-height:1.62;color:var(--fg);max-width:42rem;margin:0 0 8px}
.reads{font-size:13.5px;line-height:1.6;color:var(--muted);max-width:42rem;margin:0 0 12px}
.tagline{font-family:var(--serif);font-style:italic;font-size:16.5px;color:var(--eng);font-weight:600;margin:0 0 10px}
.familynav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.fam-item{flex:1;min-width:150px;border:1px solid var(--line);border-radius:9px;background:var(--card);padding:8px 11px;text-decoration:none}
.fam-item.current{border-color:var(--eng);background:color-mix(in srgb,var(--eng) 8%,var(--card))}
.fam-item .fn{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--out)}
.fam-item.current .fn{color:var(--eng)}
.fam-item .fd{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.seam{font-size:12.5px;line-height:1.55;color:var(--fg);background:color-mix(in srgb,var(--sub) 8%,transparent);border:1px solid color-mix(in srgb,var(--sub) 30%,var(--line));border-radius:9px;padding:10px 13px;margin:0 0 6px;max-width:44rem}
.seam b{color:var(--eng)}
.stepnav{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(4px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:16px 0 8px;padding:9px 2px;display:flex;flex-wrap:wrap;gap:6px 9px;align-items:center;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.stepnav .k{color:var(--muted);letter-spacing:.14em;font-size:9px;margin-right:2px}
.stepnav a{color:var(--out);text-decoration:none;padding:2px 3px}
.stepnav a:hover{color:var(--eng)}
.stepnav .sep{color:var(--muted);opacity:.55}
.steph{scroll-margin-top:52px;font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--out);border-bottom:1px solid var(--line);padding-bottom:7px;margin:30px 0 12px;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.steph .sg{font-family:var(--serif);font-style:italic;font-size:12.5px;text-transform:none;letter-spacing:0;color:var(--muted)}
.node{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:15px 17px;margin:0 0 12px}
.node-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:0 0 3px}
.node-h h3{font-family:var(--serif);font-size:19px;font-weight:600;color:var(--eng);margin:0;line-height:1.15}
.node-h .also{font-family:var(--mono);font-size:11px;color:var(--muted)}
.status{margin-left:auto;font-family:var(--mono);font-size:10px;letter-spacing:.03em;color:var(--fg);background:var(--paper2);border:1px solid var(--line);border-radius:5px;padding:2px 8px}
.status.next{color:#8a5a12;background:color-mix(in srgb,var(--honey) 24%,var(--bg));border-color:color-mix(in srgb,var(--honey) 55%,var(--line))}
.status.built{color:#2f6d43;background:color-mix(in srgb,#3F7D57 18%,var(--bg));border-color:color-mix(in srgb,#3F7D57 45%,var(--line))}
.lv{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.03em;border-radius:5px;padding:1px 7px;margin-right:8px;vertical-align:1px}
.lv.live{color:#2f6d43;background:color-mix(in srgb,#3F7D57 16%,var(--bg));border:1px solid color-mix(in srgb,#3F7D57 40%,var(--line))}
.lv.broken{color:#a33;background:color-mix(in srgb,#C4602F 14%,var(--bg));border:1px solid color-mix(in srgb,#C4602F 45%,var(--line))}
.builtlink{color:#2f6d43;font-weight:600;text-decoration:none;border-bottom:1px solid color-mix(in srgb,#3F7D57 45%,transparent)}
.frozen{font-family:var(--mono);font-size:10px;color:var(--fg);opacity:.7}
.oneline{font-family:var(--serif);font-size:14.5px;color:var(--fg);margin:0 0 10px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
.pill{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.pass{color:#fff;background:var(--sub);border-color:var(--sub)}
.pill.pending{color:#8a5a12;background:color-mix(in srgb,var(--honey) 22%,var(--bg));border-color:color-mix(in srgb,var(--honey) 50%,var(--line))}
.pill.na{opacity:.6}
.pill.fail{color:#fff;background:var(--out);border-color:var(--out)}
/* review pills — has-feedback-to-work-on (PI / GPT) + work state */
.review{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 11px;align-items:center}
.review .rlab{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:2px}
.rv{font-family:var(--mono);font-size:9.5px;letter-spacing:.04em;text-transform:uppercase;padding:2px 9px;border-radius:999px;border:1px solid var(--line);text-decoration:none}
.rv.pi{color:#7a3e12;background:color-mix(in srgb,var(--out) 16%,var(--bg));border-color:color-mix(in srgb,var(--out) 45%,var(--line))}
.rv.gpt{color:#8a5a12;background:color-mix(in srgb,var(--honey) 22%,var(--bg));border-color:color-mix(in srgb,var(--honey) 50%,var(--line))}
.rv.st{color:var(--muted)}
.rv.st-next,.rv.st-note{color:#8a5a12;background:color-mix(in srgb,var(--honey) 18%,var(--bg));border-color:color-mix(in srgb,var(--honey) 45%,var(--line))}
.rv.st-shipped,.rv.st-ok{color:#2f6d43;background:color-mix(in srgb,var(--sub) 16%,var(--bg));border-color:color-mix(in srgb,var(--sub) 45%,var(--line))}
.rv.st-blocked{color:#fff;background:var(--out);border-color:var(--out)}
.rv.st-building,.rv.st-repurpose{color:var(--eng);background:color-mix(in srgb,var(--eng) 10%,var(--bg));border-color:color-mix(in srgb,var(--eng) 35%,var(--line))}
.review .rnote{font-family:var(--mono);font-size:9.5px;color:var(--muted);font-style:normal}
.critbox{border:1px solid color-mix(in srgb,var(--out) 40%,var(--line));background:color-mix(in srgb,var(--out) 5%,var(--card));border-radius:10px;padding:12px 15px;margin:14px 0 0}
.critbox .crith{font-size:14px;color:var(--fg)}
.critbox .crith .csnum{color:#2f6d43;font-weight:600}
.critbox .crith a{color:var(--out);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--out) 40%,transparent)}
.critbox .csnote{font-family:var(--sans);font-size:12px;color:var(--muted);line-height:1.5;margin:6px 0 0}
.critbox .cskey{font-family:var(--mono);font-size:9.5px;color:var(--muted);margin:8px 0 0;display:flex;gap:12px;flex-wrap:wrap}
.critbox .cskey .k-ship{color:#2f6d43}.critbox .cskey .k-next{color:#8a5a12}.critbox .cskey .k-block{color:var(--out)}
.spec{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px;line-height:1.5}
.spec dt{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--out);padding-top:3px}
.spec dd{margin:0;color:var(--fg)}
.spec dd .mono{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.vchips{display:flex;gap:6px;flex-wrap:wrap}
.vchip{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid color-mix(in srgb,var(--olive) 45%,var(--line));background:color-mix(in srgb,var(--olive) 8%,transparent);color:var(--fg)}
.vchip .vn{font-family:var(--mono);font-size:10px;color:var(--muted);margin-left:5px}
.figfooter{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);margin-top:40px;padding:18px 0 8px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.figfooter a{color:var(--out);text-decoration:none}
.themebtn{position:fixed;top:14px;right:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;z-index:20}
.err{color:var(--out);font-family:var(--mono);font-size:13px;padding:20px}
.critbox .rlab{font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block;margin:0 0 2px}
.critbox ol,.critbox ul{margin:4px 0 0;padding-left:20px}
.critbox ol li,.critbox ul li{font-family:var(--sans);font-size:11.5px;color:var(--muted);line-height:1.5;margin:2px 0}
.critbox .ctsec{margin:9px 0 0}
.critbox .ctdocs{font-family:var(--mono);font-size:10px;color:var(--muted);margin:10px 0 0}
.critbox .ctdocs a{color:var(--out);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--out) 40%,transparent)}
</style>
</head>
<body>
<button class="themebtn" onclick="var r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'">theme</button>
<div class="wrap">
  <div class="topbar">
    <a href="/engine/method-engine.html">&larr; the method engine</a>
    <a href="/engine/design-principles.html">the grammar &amp; gate</a>
    <a href="/engine/design-state.html">the work-state &rarr;</a>
  </div>
  <header>
    <p class="eyebrow">design-SB · schema · the right side of the bow-tie</p>
    <h1 id="title">The Design Engine</h1>
    <p class="tagline" id="tagline"></p>
    <p class="lede" id="subtitle"></p>
    <p class="reads" id="reads"></p>
    <p class="seam" id="seam"></p>
    <div id="critbanner"></div>
    <nav class="familynav" id="familynav"></nav>
  </header>
  <nav class="stepnav" id="stepnav"></nav>
  <div id="steps"></div>
  <section id="contract"></section>
  <footer class="figfooter">
    <span>Grammar of Meaning · the design engine</span>
    <span><a href="/engine/design-principles.html">grammar + gate</a> · <a href="/_staging/viz_house_pattern.html">the gallery (look-and-feel)</a> · validated by 3DR-16</span>
  </footer>
</div>
<script>
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function pill(name,st){var w=String(st||'').toLowerCase();var c=w==='pass'?'pass':w==='pending'?'pending':w==='fail'?'fail':'na';var disp=w==='n/a'||w===''?'n/a':st;return '<span class="pill '+c+'">'+esc(name)+' · '+esc(disp)+'</span>';}
/* The pill used to be recovered by REGEXING the free-text status prose (/built|v1 draft/i) — the status
   -vocabulary collapse made executable. It now derives from n.status_axes, which is itself derived from the
   node's own machine fields by scripts/analysis/build_design_engine_status_axes.py. Same derive() contract as
   all.html, room.html and the viz house: one store, one label rule.
   The prose survives as the editorial one-liner beneath — it says what the axes cannot (which grammar a
   figure uses, what v2 would add). It just no longer decides a colour. */
function derive(s){
  if(!s) return {label:'\u2014',cls:''};
  var d=s.deployment,i=s.implementation,o;
  if(d==='live'&&i==='built') o={label:'live',cls:' built'};
  else if(d==='live'&&(i==='partial'||s.maturity==='pilot')) o={label:'pilot',cls:' next'};
  else if(d==='staging') o={label:'preview',cls:' next'};
  else if(d==='offline'&&i==='partial') o={label:'paused',cls:''};
  else if(d==='offline'&&i==='unbuilt') o={label:'planned',cls:''};
  else o={label:(i||'\u2014'),cls:''};
  if(s.dependency==='blocked') o.label+=' \u00b7 blocked';
  return o;
}
function statusBadge(n){
  var ax=n&&n.status_axes, d=derive(ax);
  var tip=ax?['implementation','maturity','deployment','data','coverage','review','dependency','evidence']
      .map(function(k){return k+': '+ax[k];}).join(' \u00b7 '):'';
  /* a prose-vs-machine disagreement is shown, not silently resolved in favour of one of them */
  var warn=(ax&&ax.disagrees_with_prose)?'<span class="status" title="'+esc(ax.disagrees_with_prose.join('; '))
      +'" style="margin-left:6px;color:#a33;border-color:color-mix(in srgb,#C4602F 45%,var(--line))">\u26a0 disagrees with its own record</span>':'';
  return '<span class="status'+d.cls+'"'+(tip?' title="'+esc(tip)+'"':'')+'>'+esc(d.label)+'</span>'+warn;
}
function statusProse(s){return s?'<p class="one" style="opacity:.72">'+esc(s)+'</p>':'';}
function reviewRow(r){
  if(!r||(!r.pi&&!r.gpt&&!r.status))return '';
  var h='<div class="review"><span class="rlab">review</span>';
  if(r.pi)h+='<span class="rv pi">PI notes</span>';
  if(r.gpt)h+='<span class="rv gpt">GPT crit</span>';
  if(r.status){var s=String(r.status).toLowerCase();
    h+=(r.doc?'<a class="rv st st-'+s+'" href="'+esc(r.doc)+'">'+esc(r.status)+' &rarr;</a>':'<span class="rv st st-'+s+'">'+esc(r.status)+'</span>');}
  if(r.note)h+='<span class="rnote">'+esc(r.note)+'</span>';
  return h+'</div>';
}
function nodeCard(n){
  var g=n.gate||{};
  var pills='<div class="pills">'+pill('Fidelity',g.fidelity)+pill('Cold Read',g.cold_read)+pill('Cold Start',g.cold_start)+pill('vs-Wild',g.vs_wild)+'</div>';
  var rf=n.reads_from||{};
  var feeds=(rf.feeds||[]).map(function(f){return esc(f);}).join(' · ');
  var vars='<div class="vchips">'+(n.variants||[]).map(function(v){return '<span class="vchip">'+esc(v.name)+'<span class="vn">'+esc(v.note||'')+'</span></span>';}).join('')+'</div>';
  return '<div class="node" id="'+esc(n.id)+'">'+
    '<div class="node-h"><h3>'+esc(n.name)+'</h3>'+(n.also?'<span class="also">also: '+esc(n.also)+'</span>':'')+statusBadge(n)+'</div>'+statusProse(n.status)+
    reviewRow(n.review)+
    '<p class="oneline">'+esc(n.one_line)+'</p>'+
    pills+
    '<dl class="spec">'+
      (n.built?'<dt>built</dt><dd>'+((n.built.missing&&n.built.missing.length)?'<span class="lv broken">⚠ link broken</span>':(n.built.live?'<span class="lv live">● live</span>':''))+'<a class="builtlink" href="'+esc(n.built.file)+'">view the '+esc(n.built.state||'draft')+' &rarr;</a> <span class="mono">'+esc(n.built.renders||'')+'</span>'+(n.built.frozen_reason?'<br><span class="frozen">frozen — '+esc(n.built.frozen_reason)+'</span>':'')+'</dd>':'')+
      '<dt>reads from</dt><dd><b>'+esc(rf.method_node||'')+'</b> · <span class="mono">'+feeds+'</span></dd>'+
      '<dt>encoding</dt><dd>'+esc(n.encoding)+'</dd>'+
      '<dt>variants</dt><dd>'+vars+'</dd>'+
      (n.composes_into?'<dt>composes into</dt><dd>'+esc(n.composes_into)+'</dd>':'')+
      (n.audience?'<dt>audience</dt><dd>'+esc(n.audience)+'</dd>':'')+
      (n.off_the_shelf?'<dt>off-the-shelf</dt><dd>'+esc(n.off_the_shelf)+'</dd>':'')+
      (n.reference?'<dt>reference</dt><dd>'+esc(n.reference)+'</dd>':'')+
    '</dl>'+
  '</div>';
}
fetch('/engine/data/viz/design_engine.json').then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
 .then(function(d){
   var p=d.page||{};
   if(p.title)document.getElementById('title').textContent=p.title;
   if(p.tagline)document.getElementById('tagline').textContent=p.tagline;
   if(p.subtitle)document.getElementById('subtitle').textContent=p.subtitle;
   if(p.reads)document.getElementById('reads').textContent=p.reads;
   if(d.seam)document.getElementById('seam').innerHTML='<b>The seam:</b> '+esc(d.seam);
   var cs=d.crit_session;
   if(cs){ document.getElementById('critbanner').innerHTML=
     '<div class="critbox"><div class="crith"><b>'+esc(cs.title)+'</b> · <span class="csnum">'+cs.updated+' updated</span> / '+cs.reviewed+' reviewed'+
     (cs.build_plan?' · <a href="'+esc(cs.build_plan)+'">the build plan (DWS) &rarr;</a>':'')+'</div>'+
     '<div class="csnote">'+esc(cs.note)+'</div>'+
     '<div class="cskey"><span class="k-ship">■ shipped / ok = updated &amp; live</span><span class="k-next">■ next / building = in the queue</span><span class="k-block">■ blocked = waiting on Atlas Reader feeds</span> · each figure below links to its feedback</div></div>'; }
   if(p.family)document.getElementById('familynav').innerHTML=p.family.map(function(f){return '<a class="fam-item'+(f.here?' current':'')+'" href="'+esc(f.href)+'"><span class="fn">'+esc(f.name)+'</span><span class="fd">'+esc(f.does)+'</span></a>';}).join('');
   var nodes=d.nodes||[];
   var steps=(d.steps||[]).filter(function(st){return nodes.some(function(n){return n.step===st.key;});});
   document.getElementById('stepnav').innerHTML='<span class="k">the engine</span>'+
     steps.map(function(st){return '<a href="#step-'+esc(st.key)+'">'+esc(st.label)+'</a>';}).join('<span class="sep">&rarr;</span>');
   var html=steps.map(function(st){
     var ns=nodes.filter(function(n){return n.step===st.key;});
     return '<div class="steph" id="step-'+esc(st.key)+'">'+esc(st.label)+' <span class="sg">'+esc(st.gloss||'')+'</span></div>'+ns.map(nodeCard).join('');
   }).join('');
   document.getElementById('steps').innerHTML=html;
   var ct=d.contract;
   if(ct){ document.getElementById('contract').innerHTML=
     '<div class="critbox"><div class="crith"><b>'+esc(ct.title)+'</b></div>'+
     '<div class="csnote">'+esc(ct.intro)+'</div>'+
     (ct.review?'<div class="ctsec"><span class="rlab">the review · '+esc(ct.review.who||'')+'</span><ul>'+
        (ct.review.tiers||[]).map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul></div>'+
        '<div class="ctsec"><span class="rlab">each sweep checks</span><ul>'+
        (ct.review.checks||[]).map(function(c){return '<li>'+esc(c)+'</li>';}).join('')+'</ul></div>':'')+
     '<div class="ctsec"><span class="rlab">the rules content-owners follow</span><ol>'+
        (ct.rules||[]).map(function(x){return '<li>'+esc(x)+'</li>';}).join('')+'</ol></div>'+
     '<div class="ctdocs">canonical: '+(ct.docs||[]).map(function(dd){return dd.href?('<a href="'+esc(dd.href)+'">'+esc(dd.label)+' &rarr;</a>'):(esc(dd.label)+' — '+esc(dd.ref));}).join(' · ')+'</div>'+
     '</div>'; }
 })
 .catch(function(e){document.getElementById('steps').innerHTML='<p class="err">could not load the design engine ('+e.message+').</p>';});
</script>
</body></html>
