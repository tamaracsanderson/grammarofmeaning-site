<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>The visualization house — principles</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* GoM house pattern — the visualization principles page. Sibling of engine/method-principles.html. */
:root{--bg:#F6F1E4;--paper2:#EFE7D3;--fg:#24302A;--muted:#6E7669;--line:#C9BE9F;--card:#FFFDF6;
 --eng:#2C4A38;--sub:#3F7D57;--out:#C4602F;--honey:#E0A93B;--olive:#6E7B3A;--gold:#B08A3C;
 --serif:"Newsreader",ui-serif,Georgia,serif;--sans:"Inter",ui-sans-serif,system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media(prefers-color-scheme:dark){:root{--bg:#1B211D;--paper2:#232A25;--fg:#EDE7D8;--muted:#A6AEA3;--line:#3A423C;--card:#232A25;--eng:#4A7A5C;--sub:#5C9A72;--out:#D9793F;--honey:#E0A93B;--olive:#9CA86A;--gold:#c9a24e}}
:root[data-theme=dark]{--bg:#1B211D;--paper2:#232A25;--fg:#EDE7D8;--muted:#A6AEA3;--line:#3A423C;--card:#232A25;--eng:#4A7A5C;--sub:#5C9A72;--out:#D9793F;--honey:#E0A93B;--olive:#9CA86A;--gold:#c9a24e}
:root[data-theme=light]{--bg:#F6F1E4;--paper2:#EFE7D3;--fg:#24302A;--muted:#6E7669;--line:#C9BE9F;--card:#FFFDF6;--eng:#2C4A38;--sub:#3F7D57;--out:#C4602F;--honey:#E0A93B;--olive:#6E7B3A;--gold:#B08A3C}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--sans);font-feature-settings:"ss01","cv11"}
.wrap{max-width:52rem;margin:0 auto;padding:26px 22px 30px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.topbar a{font-size:13px;color:var(--out);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--out) 40%,transparent)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
h1{font-family:var(--serif);font-size:clamp(28px,4.4vw,43px);font-weight:600;letter-spacing:-.01em;color:var(--eng);margin:0 0 12px;line-height:1.1}
.lede{font-family:var(--serif);font-size:17px;line-height:1.62;color:var(--fg);max-width:42rem;margin:0 0 8px}
.reads{font-size:13.5px;line-height:1.6;color:var(--muted);max-width:42rem;margin:0}
.tagline{font-family:var(--serif);font-style:italic;font-size:16.5px;color:var(--eng);font-weight:600;margin:0 0 10px}
.familynav{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 0}
.fam-item{flex:1;min-width:150px;border:1px solid var(--line);border-radius:9px;background:var(--card);padding:8px 11px;text-decoration:none}
.fam-item.current{border-color:var(--eng);background:color-mix(in srgb,var(--eng) 8%,var(--card))}
.fam-item .fn{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--out)}
.fam-item.current .fn{color:var(--eng)}
.fam-item .fd{font-size:12px;color:var(--muted);display:block;margin-top:2px}
.toc{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(4px);border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:18px 0 8px;padding:9px 0;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.toc .k{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.toc a{font-family:var(--mono);font-size:11px;color:var(--out);text-decoration:none;padding:2px 7px;border:1px solid color-mix(in srgb,var(--out) 30%,var(--line));border-radius:999px}
.toc a:hover{background:color-mix(in srgb,var(--out) 8%,transparent)}
.sec{margin:34px 0 0;scroll-margin-top:60px}
.sec-h{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--out);border-bottom:1px solid var(--line);padding-bottom:7px;margin:0 0 6px}
.sec-note{font-family:var(--serif);font-style:italic;font-size:13.5px;color:var(--muted);margin:0 0 14px;max-width:44rem}
.pr{border:1px solid var(--line);border-radius:11px;background:var(--card);padding:14px 17px;margin:0 0 11px}
.pr h3{font-family:var(--serif);font-size:17px;font-weight:600;color:var(--eng);margin:0 0 4px;line-height:1.2}
.pr p{margin:0;font-size:13.5px;line-height:1.6;color:var(--fg)}
.pr .vals{font-family:var(--mono);font-size:11px;color:var(--out);margin:0 0 5px}
.kv{margin:0 0 11px}
.kv .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--out);font-weight:600;margin:0 0 2px}
.kv .v{font-size:14px;line-height:1.55;color:var(--fg);margin:0}
ol.steps{margin:4px 0;padding-left:20px}
ol.steps li{font-size:13.5px;line-height:1.55;margin:0 0 6px}
ol.steps li::marker{font-family:var(--mono);font-size:11px;color:var(--out)}
ul.rules{margin:4px 0;padding-left:18px}
ul.rules li{font-size:13.5px;line-height:1.55;margin:0 0 6px}
.rm{width:100%;border-collapse:collapse;font-size:13px}
.rm caption{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--out);text-align:left;padding:10px 0 4px}
.rm td{padding:7px 10px 7px 0;vertical-align:top;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.rm .rv{color:var(--fg);font-weight:500;min-width:150px}
.rm .rf{color:var(--muted);font-size:12px;font-family:var(--mono)}
.rbadge{display:inline-block;font-family:var(--mono);font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;font-weight:600;padding:2px 7px;border-radius:4px;white-space:nowrap;border:1px solid var(--line)}
.rbadge.rendered{color:#fff;background:var(--sub);border-color:var(--sub)}
.rbadge.data{color:#8a5a12;background:color-mix(in srgb,var(--honey) 26%,var(--bg));border-color:color-mix(in srgb,var(--honey) 55%,var(--line))}
.rbadge.artifact{color:var(--gold);background:color-mix(in srgb,var(--gold) 12%,transparent);border-color:color-mix(in srgb,var(--gold) 45%,var(--line))}
.rbadge.todo,.rbadge.planned{color:var(--muted);background:var(--paper2)}
.figfooter{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);margin-top:40px;padding:18px 0 8px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.themebtn{position:fixed;top:14px;right:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;z-index:20}
.err{color:var(--out);font-family:var(--mono);font-size:13px;padding:20px}
</style>
</head>
<body>
<button class="themebtn" onclick="var r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'">theme</button>
<div class="wrap">
  <div class="topbar">
    <a href="/engine/design-engine.html">&larr; the design engine</a>
    <a href="/engine/design-state.html">the work-state</a>
    <a href="/engine/method-principles.html">the method &middot; principles &rarr;</a>
  </div>
  <header>
    <p class="eyebrow" id="eyebrow">design-SB · the design engine · principles</p>
    <h1 id="title">The design engine — principles</h1>
    <p class="tagline" id="tagline"></p>
    <p class="lede" id="subtitle"></p>
    <p class="reads" id="reads"></p>
    <nav class="familynav" id="familynav"></nav>
  </header>
  <nav class="toc" id="toc"><span class="k">on this page</span></nav>
  <div id="sections"></div>
  <footer class="figfooter"><span>Grammar of Meaning · visualization principles</span><span id="ver">staging · v0</span></footer>
</div>
<script>
// render-from-data: the page about headless IS headless. Reads engine/data/viz/viz_principles.json.
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function rich(s){return String(s==null?'':s);}
var SECTIONS=[
  {id:'model',label:'The model',key:'the_model',render:renderModel},
  {id:'axes',label:'Two axes',key:'two_axes',render:renderAxes},
  {id:'grammar',label:'The grammar',key:'the_grammar',render:renderGrammar},
  {id:'checks',label:'The gate',key:'the_checks',render:renderChecks},
  {id:'moodboard',label:'What good looks like',key:'the_moodboard',render:renderMoodboard},
  {id:'process',label:'The process',key:'the_process',render:renderProcess},
  {id:'look',label:'Signature look',key:'signature_look',render:renderLook},
  {id:'roadmap',label:'Redesign roadmap',key:'roadmap',render:renderRoadmap}
];
function secShell(s,inner){return '<section class="sec" id="'+s.id+'"><div class="sec-h">'+esc(s.label)+'</div>'+inner+'</section>';}
function note(d){return d&&d.note?'<p class="sec-note">'+rich(d.note)+'</p>':'';}
function renderModel(d){return note(d)+(d.points||[]).map(function(p){return '<div class="pr"><h3>'+rich(p.name)+'</h3><p>'+rich(p.body)+'</p></div>';}).join('');}
function renderAxes(d){return note(d)+(d.axes||[]).map(function(a){return '<div class="pr"><h3>'+rich(a.axis)+'</h3>'+(a.values?'<p class="vals">'+rich(a.values)+'</p>':'')+'<p>'+rich(a.body)+'</p></div>';}).join('');}
function renderProcess(d){return note(d)+'<ol class="steps">'+(d.steps||[]).map(function(s){return '<li>'+rich(s)+'</li>';}).join('')+'</ol>';}
function renderLook(d){return note(d)+'<ul class="rules">'+(d.rules||[]).map(function(s){return '<li>'+rich(s)+'</li>';}).join('')+'</ul>';}
function renderRoadmap(d){
  var badge=function(st){var w=String(st||'').toLowerCase();var c=w.indexOf('rendered')>-1?'rendered':w.indexOf('data ready')>-1?'data':w.indexOf('artifact')>-1?'artifact':w.indexOf('planned')>-1?'planned':'todo';return '<span class="rbadge '+c+'">'+esc(st)+'</span>';};
  return note(d)+(d.groups||[]).map(function(g){
    return '<table class="rm"><caption>'+esc(g.group)+'</caption><tbody>'+(g.items||[]).map(function(it){
      return '<tr><td class="rv">'+rich(it.viz)+'</td><td class="rf">'+esc(it.from)+'</td><td>'+badge(it.status)+'</td></tr>';
    }).join('')+'</tbody></table>';
  }).join('');
}
function renderGrammar(d){
  var key=d.key?'<div class="pr"><p class="vals">the one-line key</p><p>'+rich(d.key)+'</p></div>':'';
  var rules='<table class="rm"><caption>the rules — data dimension &rarr; visual variable</caption><tbody>'+(d.rules||[]).map(function(r){
    return '<tr><td class="rv">'+rich(r.variable)+'</td><td>'+rich(r.carries)+(r.why?'<br><span class="rf">'+rich(r.why)+'</span>':'')+'</td></tr>';
  }).join('')+'</tbody></table>';
  var cv=d.constant_vs_variable?('<div class="kv"><p class="k">constant across domains</p><p class="v">'+(d.constant_vs_variable.constant||[]).map(esc).join(' · ')+'</p></div><div class="kv"><p class="k">allowed to vary</p><p class="v">'+(d.constant_vs_variable.variable||[]).map(esc).join(' · ')+'</p></div>'):'';
  return note(d)+key+rules+cv;
}
function renderChecks(d){
  var checks=(d.checks||[]).map(function(c){
    return '<div class="pr"><h3>'+rich(c.name)+'</h3><p>'+rich(c.asks)+'</p>'+(c.on_figure?'<p class="vals" style="margin-top:6px">on the figure &middot; '+rich(c.on_figure)+'</p>':'')+'</div>';
  }).join('');
  var vr=d.variants_rule?'<div class="kv"><p class="k">variants</p><p class="v">'+rich(d.variants_rule)+'</p></div>':'';
  return note(d)+checks+vr;
}
function renderMoodboard(d){
  var bar=d.the_bar?'<div class="pr"><p class="vals">the bar — what good looks like</p><p>'+rich(d.the_bar)+'</p></div>':'';
  var refs='<table class="rm"><caption>the studio wall — references to study</caption><tbody>'+(d.references||[]).map(function(r){
    return '<tr><td class="rv">'+rich(r.name)+(r.for?'<br><span class="rf">for: '+rich(r.for)+'</span>':'')+'</td><td>'+rich(r.teaches)+'</td></tr>';
  }).join('')+'</tbody></table>';
  return note(d)+bar+refs;
}
fetch('/engine/data/viz/viz_principles.json').then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
 .then(function(d){
   var p=d.page||{};
   if(p.title)document.getElementById('title').textContent=p.title;
   if(p.tagline)document.getElementById('tagline').textContent=p.tagline;
   if(p.subtitle)document.getElementById('subtitle').textContent=p.subtitle;
   if(p.reads)document.getElementById('reads').textContent=p.reads;
   if(p.family)document.getElementById('familynav').innerHTML=p.family.map(function(f){return '<a class="fam-item'+(f.here?' current':'')+'" href="'+esc(f.href)+'"><span class="fn">'+esc(f.name)+'</span><span class="fd">'+esc(f.does)+'</span></a>';}).join('');
   var live=SECTIONS.filter(function(s){return d[s.key];});
   var toc=document.getElementById('toc');
   live.forEach(function(s){var a=document.createElement('a');a.href='#'+s.id;a.textContent=s.label;toc.appendChild(a);});
   document.getElementById('sections').innerHTML=live.map(function(s){return secShell(s,s.render(d[s.key]));}).join('');
 })
 .catch(function(e){document.getElementById('sections').innerHTML='<p class="err">could not load the principles ('+e.message+').</p>';});
</script>
</body></html>
