<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Method FAQ — the hard questions — Grammar of Meaning</title>
<style>
:root{--bg:#F6F1E4;--paper:#FFFDF6;--paper2:#EFE7D3;--fg:#24302A;--muted:#6E7669;--line:#C9BE9F;
 --eng:#2C4A38;--sub:#3F7D57;--out:#C4602F;--honey:#E0A93B;
 --serif:"Newsreader",Iowan Old Style,Palatino,Georgia,serif;
 --sans:"Inter",ui-sans-serif,-apple-system,Segoe UI,sans-serif;
 --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media(prefers-color-scheme:dark){:root{--bg:#1B211D;--paper:#232A25;--paper2:#2A322B;--fg:#EDE7D8;
 --muted:#A6AEA3;--line:#3A423C;--eng:#8FBF9E;--sub:#6FAF86;--out:#D9793F;--honey:#E0A93B}}
:root[data-theme=dark]{--bg:#1B211D;--paper:#232A25;--paper2:#2A322B;--fg:#EDE7D8;--muted:#A6AEA3;
 --line:#3A423C;--eng:#8FBF9E;--sub:#6FAF86;--out:#D9793F}
:root[data-theme=light]{--bg:#F6F1E4;--paper:#FFFDF6;--paper2:#EFE7D3;--fg:#24302A;--muted:#6E7669;
 --line:#C9BE9F;--eng:#2C4A38;--sub:#3F7D57;--out:#C4602F}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--serif);font-size:17px;line-height:1.62}
.topbar{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;
 gap:12px;padding:9px 18px;background:color-mix(in srgb,var(--bg) 88%,transparent);
 backdrop-filter:blur(4px);border-bottom:1px solid var(--line)}
.back{font-family:var(--sans);font-size:13px;color:var(--sub);text-decoration:none;
 border-bottom:1px solid color-mix(in srgb,var(--sub) 45%,transparent)}
.back:hover{background:color-mix(in srgb,var(--sub) 12%,transparent)}
.themebtn{background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 13px;
 font-size:12px;cursor:pointer;color:var(--fg);font-family:var(--sans)}
main{max-width:48rem;margin:0 auto;padding:5vh 22px 12vh}
.kicker{font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
h1{font-size:30px;line-height:1.18;font-weight:600;color:var(--eng);margin:0 0 8px;text-wrap:balance}
.intro{font-size:15.5px;color:var(--fg);border-left:3px solid var(--sub);padding:2px 0 2px 16px;margin:14px 0 6px;
 background:color-mix(in srgb,var(--sub) 5%,transparent)}
.intro p{margin:8px 0} .intro ul{margin:8px 0;padding-left:20px} .intro li{margin:4px 0}
.intro a{color:var(--out);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--out) 40%,transparent)}
h2.sec{font-size:14px;font-family:var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);
 margin:38px 0 4px;padding-bottom:5px;border-bottom:1px solid var(--line);scroll-margin-top:64px}
.sec-sub{font-family:var(--sans);font-size:12.5px;color:var(--muted);margin:0 0 12px}
.theme-intro{font-family:var(--sans);font-size:13px;font-style:italic;color:var(--muted);margin:2px 0 14px;line-height:1.5}
.qa{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin:12px 0;background:var(--paper);scroll-margin-top:70px}
.qa.answered{border-left:4px solid var(--sub)}
.qa.open{border-left:4px solid var(--out);background:var(--paper2)}
.qa.partial{border-left:4px solid var(--honey);background:var(--paper2)}
.qa h3{font-size:16px;font-weight:600;color:var(--fg);margin:0 0 8px;line-height:1.4;font-family:var(--serif)}
.qa .rn{font-family:var(--mono);font-size:12px;color:var(--eng);background:color-mix(in srgb,var(--eng) 12%,transparent);
 padding:1px 7px;border-radius:6px;margin-right:8px;vertical-align:2px}
.qa .resp{font-size:15px;margin:6px 0}
.qa .resp p,.qa .evid p,.status p{margin:8px 0}
.status{font-size:14px;border-radius:8px;padding:8px 12px;margin:10px 0 6px}
.status.open{background:color-mix(in srgb,var(--out) 9%,transparent);border:1px solid color-mix(in srgb,var(--out) 30%,transparent)}
.status.partial{background:color-mix(in srgb,var(--honey) 12%,transparent);border:1px solid color-mix(in srgb,var(--honey) 40%,transparent)}
.status.answered{background:color-mix(in srgb,var(--sub) 10%,transparent);border:1px solid color-mix(in srgb,var(--sub) 30%,transparent)}
.slab{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
 padding:2px 8px;border-radius:999px;margin-right:8px;vertical-align:1px;color:#fff;white-space:nowrap}
.slab.open{background:var(--out)}
.slab.partial{background:var(--honey);color:#3a2c05}
.slab.answered{background:var(--sub)}
.evid{font-size:12.5px;color:var(--muted);margin-top:8px;font-family:var(--sans)}
.evid .evlab{font-weight:700;color:var(--fg);text-transform:uppercase;letter-spacing:.05em;font-size:10.5px;margin-right:6px}
.evid code,.resp code,.status code,.intro code{font-family:var(--mono);font-size:.86em;background:color-mix(in srgb,var(--line) 30%,transparent);padding:0 4px;border-radius:4px;word-break:break-word}
.evid a,.resp a,.status a,.tests-body a{color:var(--out);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--out) 40%,transparent)}
.ev-ref{color:var(--muted);border-bottom:1px dotted var(--muted);cursor:help}
.testsfold{border:1px solid var(--line);border-radius:10px;margin:14px 0;background:var(--paper)}
.testsfold summary{cursor:pointer;padding:12px 16px;font-family:var(--sans);font-size:13.5px;color:var(--fg);list-style:none}
.testsfold summary::-webkit-details-marker{display:none}
.testsfold summary::before{content:'▸  ';color:var(--out)}
.testsfold[open] summary::before{content:'▾  '}
.testbanner{font-family:var(--sans);font-size:12.5px;color:var(--out);background:color-mix(in srgb,var(--out) 8%,transparent);
 border:1px solid color-mix(in srgb,var(--out) 28%,transparent);border-radius:8px;padding:9px 12px;margin:0 16px 8px}
.tests-body{padding:0 16px 12px;font-size:14.5px}
.tests-body ol{padding-left:22px}
.tests-body li{margin:10px 0}
.tests-body code{font-family:var(--mono);font-size:.86em;background:color-mix(in srgb,var(--line) 30%,transparent);padding:0 4px;border-radius:4px}
.state{font-family:var(--sans);font-size:14px;color:var(--muted);margin-top:8vh;text-align:center}
</style>
</head>
<body>
<div class="topbar">
  <a class="back" href="/engine/schema.html">&larr; the engine map</a>
  <button class="themebtn" onclick="var r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'">theme</button>
</div>
<main>
  <p class="kicker">Grammar of Meaning &middot; method</p>
  <h1>Method FAQ &mdash; the hard questions</h1>
  <div id="intro"></div>
  <div id="comprehension"></div>
  <div id="faq"></div>
  <div id="tests"></div>
  <div id="fallback"></div>
</main>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
function stripFrontmatter(md){var m=md.match(/^---\r?\n[\s\S]*?\r?\n---\r?\n?/);return m?md.slice(m[0].length):md;}
function md2html(s){return window.marked?marked.parse(s.trim()):('<p>'+s.replace(/</g,'&lt;')+'</p>');}
function md2inline(s){var h=md2html(s.trim());return h.replace(/^<p>/,'').replace(/<\/p>\s*$/,'');}
// GitHub-style heading slug (so the in-page cross-ref anchors in the FAQ resolve)
function slug(s){return s.toLowerCase().replace(/[^a-z0-9\s-]/g,'').replace(/\s/g,'-');}
// twelve-laws repo paths aren't deployed (private repo) → render those citations label-only (path in tooltip).
// Links that resolve (http(s), in-page #, site-relative .html) are kept live.
function fixLinks(html){
  return html.replace(/<a href="([^"]*)"([^>]*)>([\s\S]*?)<\/a>/g, function(m,href,rest,label){
    if(/^https?:/i.test(href) || href.charAt(0)==='#' || /\.html([#?][^"]*)?$/.test(href)) return m;
    return '<span class="ev-ref" title="'+String(href).replace(/"/g,'&quot;')+'">'+label+'</span>';
  });
}
function classifyStatus(txt){
  var U=txt.replace(/[*_]/g,'').trim().toUpperCase();
  if(/^OPEN\b/.test(U)) return 'open';
  if(/^PARTIAL\b/.test(U)) return 'partial';
  if(/^ANSWERED IN PRINCIPLE/.test(U)) return 'partial';       // answered-in-principle + confirming-run-open = partial
  if(/^ANSWERED\b/.test(U)) return 'answered';
  if(U.indexOf('OPEN')>-1 && U.indexOf('ANSWER')===-1) return 'open';
  return 'partial';
}
function slabText(cls){return cls==='answered'?'Answered':cls==='partial'?'Partial':'Open';}

// parse one "### ID · question" entry
function parseEntry(chunk){
  var nl=chunk.indexOf('\n');
  var head=(nl<0?chunk:chunk.slice(0,nl)).trim();
  var body=(nl<0?'':chunk.slice(nl+1)).trim();
  var id=(head.match(/^[RS]\d+/)||[''])[0];
  var q=head.replace(/^[RS]\d+\s*·\s*/,'');
  var answer=body.split(/\n?\*\*Status\s*[—–-]\*\*/)[0].trim();
  var mS=body.match(/\*\*Status\s*[—–-]\*\*([\s\S]*?)(?=\n\*\*Evidence|$)/);
  var mE=body.match(/\*\*Evidence\s*[—–-]\*\*([\s\S]*?)$/);
  return {id:id, q:q, head:head, answer:answer, status:(mS?mS[1].trim():''), evid:(mE?mE[1].trim():'')};
}
function renderEntry(e){
  var cls=e.status?classifyStatus(e.status):'answered';
  var h='<div class="qa '+cls+'" id="'+slug(e.head)+'">';
  h+='<h3><span class="rn">'+e.id+'</span>'+md2inline(e.q)+'</h3>';
  if(e.answer) h+='<div class="resp">'+fixLinks(md2html(e.answer))+'</div>';
  if(e.status) h+='<div class="status '+cls+'"><span class="slab '+cls+'">'+slabText(cls)+'</span>'+fixLinks(md2inline(e.status))+'</div>';
  if(e.evid) h+='<div class="evid"><span class="evlab">Evidence</span>'+fixLinks(md2inline(e.evid))+'</div>';
  h+='</div>';
  return h;
}

(function(){
  fetch('/engine/artifacts/method_rebuttals_faq.md')
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
    .then(function(raw){
      var md=stripFrontmatter(raw);
      // split off TESTS QUEUE (kept as H1)
      var parts=md.split(/\n#\s+TESTS QUEUE/);
      var mainMd=parts[0];
      var testsMd=(parts[1]||'').replace(/<!--[\s\S]*?-->/g,'').trim();
      // intro: "# How to read this" up to the first "## " theme
      var introM=mainMd.match(/#\s+How to read this\s*([\s\S]*?)(?=\n##\s)/);
      if(introM) document.getElementById('intro').innerHTML='<div class="intro">'+fixLinks(md2html(introM[1]))+'</div>';
      // themes: split on "\n## "
      var themeChunks=mainMd.split(/\n##\s+/).slice(1);
      var faqHtml=themeChunks.map(function(tc){
        var nl=tc.indexOf('\n');
        var themeName=(nl<0?tc:tc.slice(0,nl)).trim();
        var rest=(nl<0?'':tc.slice(nl+1));
        // optional italic one-line intro before the first "### "
        var firstQ=rest.indexOf('\n### '); if(rest.indexOf('### ')===0) firstQ=0;
        var pre=(firstQ<0?rest:rest.slice(0, firstQ)).trim();
        var qBlock=(firstQ<0?'':rest.slice(firstQ));
        var entries=qBlock.split(/\n###\s+/).map(function(c){return c.replace(/^###\s+/,'');}).filter(function(c){return /^[RS]\d/.test(c.trim());});
        var s='<section class="theme" id="'+slug(themeName)+'"><h2 class="sec">'+md2inline(themeName)+'</h2>';
        if(pre) s+='<p class="theme-intro">'+md2inline(pre)+'</p>';
        s+=entries.map(function(c){return renderEntry(parseEntry(c.trim()));}).join('');
        s+='</section>';
        return s;
      }).join('');
      document.getElementById('faq').innerHTML=faqHtml;
      // TESTS QUEUE
      if(testsMd){
        var tH='<h2 class="sec" id="tests-queue">The tests that back these answers</h2>'
          +'<details class="testsfold"><summary>Validation roadmap &mdash; the experiments behind the answers above (expand)</summary>'
          +'<div class="testbanner">&#9888; Most of these are <b>designed or partly run</b>, not finished &mdash; they are the experiments that move OPEN items toward answered. One exception (item&nbsp;#13, the over-generation control) has a result already; it is marked.</div>'
          +'<div class="tests-body">'+fixLinks(md2html(testsMd))+'</div></details>';
        document.getElementById('tests').innerHTML=tH;
      }
    })
    .catch(function(e){
      document.getElementById('fallback').innerHTML='<p class="state">&mdash; FAQ not available yet ('+String(e.message||e)+').</p>';
    });
})();

// Comprehension section — "what is this?" (distinct from the hard questions)
(function(){
  fetch('/engine/artifacts/faq_comprehension.md')
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.text();})
    .then(function(raw){
      var md=stripFrontmatter(raw);
      var firstH=md.indexOf('\n## ');
      if(firstH<0) return;
      var chunks=md.slice(firstH).split(/\n##\s+/).slice(1);
      var h='<h2 class="sec">Comprehension &mdash; what is this?</h2>'
        +'<p class="sec-sub">Questions people ask to <b>understand</b> the method &mdash; distinct from the hard questions below.</p>';
      h+=chunks.map(function(c){
        var nl=c.indexOf('\n'); var q=c.slice(0,nl).trim(); var body=c.slice(nl+1).trim();
        return '<div class="qa answered"><h3>'+md2inline(q)+'</h3><div class="resp">'+fixLinks(md2html(body))+'</div></div>';
      }).join('');
      document.getElementById('comprehension').innerHTML=h;
    })
    .catch(function(){/* comprehension is optional; silent if absent */});
})();
</script>
</body>
</html>
