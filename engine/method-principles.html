<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>The Method — principles</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Grammar of Meaning house pattern — sibling of engine/principles.html + schema.html. Same palette. */
:root{--bg:#F6F1E4;--paper2:#EFE7D3;--fg:#24302A;--muted:#6E7669;--line:#C9BE9F;--card:#FFFDF6;
 --eng:#2C4A38;--sub:#3F7D57;--tbd:#8AA88B;--out:#C4602F;--honey:#E0A93B;--olive:#6E7B3A;
 --serif:"Newsreader",ui-serif,Georgia,serif;--sans:"Inter",ui-sans-serif,system-ui,sans-serif;
 --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media(prefers-color-scheme:dark){:root{--bg:#1B211D;--paper2:#232A25;--fg:#EDE7D8;--muted:#A6AEA3;--line:#3A423C;--card:#232A25;
 --eng:#4A7A5C;--sub:#5C9A72;--tbd:#6B7A6D;--out:#D9793F;--honey:#E0A93B;--olive:#9CA86A}}
:root[data-theme=dark]{--bg:#1B211D;--paper2:#232A25;--fg:#EDE7D8;--muted:#A6AEA3;--line:#3A423C;--card:#232A25;--eng:#4A7A5C;--sub:#5C9A72;--tbd:#6B7A6D;--out:#D9793F;--honey:#E0A93B;--olive:#9CA86A}
:root[data-theme=light]{--bg:#F6F1E4;--paper2:#EFE7D3;--fg:#24302A;--muted:#6E7669;--line:#C9BE9F;--card:#FFFDF6;--eng:#2C4A38;--sub:#3F7D57;--tbd:#8AA88B;--out:#C4602F;--honey:#E0A93B;--olive:#6E7B3A}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 var(--sans);font-feature-settings:"ss01","cv11"}
.wrap{max-width:52rem;margin:0 auto;padding:26px 22px 20px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.topbar a{font-size:13px;color:var(--out);text-decoration:none;border-bottom:1px solid color-mix(in srgb,var(--out) 40%,transparent)}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
h1{font-family:var(--serif);font-size:clamp(28px,4.4vw,43px);font-weight:600;letter-spacing:-.01em;color:var(--eng);margin:0 0 12px;line-height:1.1}
.lede{font-family:var(--serif);font-size:17px;line-height:1.62;color:var(--fg);max-width:42rem;margin:0 0 8px}
.reads{font-size:13.5px;line-height:1.6;color:var(--muted);max-width:42rem;margin:0}

/* sticky table of contents (jump-links) — this is reference material people scan + Ctrl-F */
.toc{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(4px);
 border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:18px 0 8px;padding:9px 0;
 display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.toc .toc-k{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.toc a{font-family:var(--mono);font-size:11px;color:var(--out);text-decoration:none;padding:2px 7px;border:1px solid color-mix(in srgb,var(--out) 30%,var(--line));border-radius:999px}
.toc a:hover{background:color-mix(in srgb,var(--out) 8%,transparent)}

/* sections */
.sec{margin:34px 0 0;scroll-margin-top:64px}
.sec-h{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--out);border-bottom:1px solid var(--line);padding-bottom:7px;margin:0 0 6px}
.sec-note{font-family:var(--serif);font-style:italic;font-size:13.5px;color:var(--muted);margin:0 0 14px;max-width:44rem}
.pr{border:1px solid var(--line);border-radius:11px;background:var(--card);padding:15px 18px;margin:0 0 12px}
.pr-h{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.pr-h h3{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--eng);margin:0;line-height:1.2}
.stmt{font-family:var(--serif);font-size:15px;line-height:1.6;color:var(--fg);margin:0 0 8px}
.mech{font-size:13.5px;line-height:1.6;color:var(--fg);margin:0 0 8px}
.reuse{font-size:12.5px;line-height:1.55;color:var(--muted);margin:6px 0 0;border-left:2px solid color-mix(in srgb,var(--sub) 45%,var(--line));padding-left:10px}
.reuse b{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--sub);font-weight:600}
.tmpl-list{margin:6px 0 4px;padding-left:20px}
.tmpl-list li{font-size:13.5px;line-height:1.55;color:var(--fg);margin:0 0 5px}
.tmpl-list li::marker{font-family:var(--mono);font-size:11px;color:var(--out)}
.chk-phase{margin:0 0 14px}
.chk-phase-h{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--eng);font-weight:600;margin:0 0 6px}
.chk-items{margin:0;padding-left:20px}
.chk-items li{font-size:13.5px;line-height:1.55;color:var(--fg);margin:0 0 5px}

/* the four field-shapes table */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0 2px}
.tbl th{text-align:left;font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:400;padding:6px 10px 6px 0;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 10px 8px 0;vertical-align:top;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.tbl .c1{font-family:var(--mono);font-size:11.5px;color:var(--eng);min-width:120px}
.tbl .c3{font-family:var(--mono);font-size:11px;color:var(--muted)}

/* the two pills */
.pill-card{border:1px solid var(--line);border-radius:11px;background:var(--card);padding:13px 16px;margin:0 0 10px}
.pill-tag{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.03em;font-weight:600;border-radius:6px;padding:3px 9px;margin-bottom:7px}
.pill-tag.is-crt{color:var(--sub);background:color-mix(in srgb,var(--sub) 12%,transparent);border:1px solid color-mix(in srgb,var(--sub) 40%,var(--line))}
.pill-tag.is-inst{color:var(--out);background:color-mix(in srgb,var(--out) 10%,transparent);border:1px solid color-mix(in srgb,var(--out) 42%,var(--line))}
.pill-card p{margin:0;font-size:14px;line-height:1.55}
.exception{font-family:var(--serif);font-style:italic;font-size:13px;color:var(--muted);border-left:2px solid var(--out);padding-left:12px;margin:10px 0 0}

/* key/value rows (reliability) */
.kv{margin:0 0 11px}
.kv .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--out);font-weight:600;margin:0 0 2px}
.kv .v{font-size:14px;line-height:1.55;color:var(--fg);margin:0}

/* glossary */
.gloss{border:1px solid var(--line);border-radius:11px;background:var(--card);padding:6px 18px}
.gloss dl{margin:0}
.gterm{display:flex;gap:10px;flex-wrap:wrap;padding:11px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.gterm:last-child{border-bottom:none}
.gterm dt{font-family:var(--mono);font-size:12.5px;font-weight:500;color:var(--eng);min-width:130px;flex:0 0 130px}
.gterm dd{margin:0;font-size:13.5px;line-height:1.55;color:var(--fg);flex:1 1 240px}

/* faq accordion */
.faq details{border:1px solid var(--line);border-radius:11px;background:var(--card);padding:0;margin:0 0 9px}
.faq summary{cursor:pointer;list-style:none;font-family:var(--serif);font-size:15.5px;font-weight:600;color:var(--eng);padding:13px 16px;line-height:1.35}
.faq summary::-webkit-details-marker{display:none}
.faq summary::before{content:"▸ ";color:var(--out);font-family:var(--sans)}
.faq details[open] summary::before{content:"▾ "}
.faq .a{padding:0 16px 14px;font-size:14px;line-height:1.62;color:var(--fg)}

/* positioning + open questions */
.vs{border-left:2px solid color-mix(in srgb,var(--eng) 40%,var(--line));padding:2px 0 2px 12px;margin:0 0 12px}
.vs .m{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--eng);margin:0 0 2px}
.vs .n{font-size:13.5px;line-height:1.55;color:var(--fg);margin:0}
.oq{margin:0 0 12px}
.oq .q{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--eng);margin:0 0 2px}
.oq .s{font-size:13.5px;line-height:1.55;color:var(--muted);margin:0}

/* roadmap table with status badges */
.rm{width:100%;border-collapse:collapse;font-size:13.5px}
.rm td{padding:10px 10px 10px 0;vertical-align:top;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.rm .rt{color:var(--fg);font-weight:500;min-width:180px}
.rm .rw{color:var(--muted);font-size:13px;line-height:1.55}
.rbadge{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:2px 7px;border-radius:4px;white-space:nowrap;border:1px solid var(--line)}
.rbadge.is-done{color:#fff;background:var(--eng);border-color:var(--eng)}
.rbadge.is-building{color:#8a5a12;background:color-mix(in srgb,var(--honey) 26%,var(--bg));border-color:color-mix(in srgb,var(--honey) 55%,var(--line))}
.rbadge.is-seeded{color:var(--sub);background:color-mix(in srgb,var(--sub) 12%,transparent);border-color:color-mix(in srgb,var(--sub) 40%,var(--line))}
.rbadge.is-planned{color:var(--muted);background:var(--paper2)}

.figfooter{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--line);margin-top:40px;padding:18px 0 8px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
.themebtn{position:fixed;top:14px;right:14px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:999px;padding:6px 12px;font-size:12px;cursor:pointer;z-index:20}
.err{color:var(--out);font-family:var(--mono);font-size:13px;padding:20px}
</style>
</head>
<body>
<button class="themebtn" onclick="var r=document.documentElement;r.dataset.theme=r.dataset.theme==='dark'?'light':'dark'">theme</button>
<div class="wrap">
  <div class="topbar">
    <a href="/engine/method-engine.html">&larr; the method engine</a>
    <a href="/engine/principles.html">the library &middot; principles &rarr;</a>
  </div>
  <header>
    <p class="eyebrow" id="eyebrow">Method · principles &amp; reusable components</p>
    <h1 id="title">The Method — principles</h1>
    <p class="lede" id="subtitle"></p>
    <p class="reads" id="reads"></p>
  </header>

  <nav class="toc" id="toc" aria-label="Contents"><span class="toc-k">on this page</span></nav>

  <div id="sections"></div>

  <footer class="figfooter"><span>The Method · Principles</span><span id="ver">V1</span></footer>
</div>

<script>
// render method-principles.html FROM the engine artifact (§2.13 / §2.16 — single store of record; the site
// renders from engine data, never hardcoded). Verbatim mirror of pm/40_architecture/DATA_method_principles_s162.json.
// If a value is wrong, reading-SB fixes the generator; this page is never hand-edited.
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function rich(s){return String(s==null?'':s);} // author text may carry inline <em>/<code>; render as-is

// the section order + labels (PI-locked TOC order), each with a renderer over its data object
var SECTIONS = [
  {id:'components', label:'Reusable components', key:'reusable_components', render:renderComponents},
  {id:'commitments',label:'Core commitments',    key:'principles',         render:renderPrinciples},
  {id:'checks',     label:'The four checks',      key:'the_four_checks',    render:renderFourChecks},
  {id:'pills',      label:'The two pills',        key:'the_two_pills',      render:renderPills},
  {id:'checklist',  label:'Drawer-build checklist',key:'drawer_build_checklist',render:renderChecklist},
  {id:'glossary',   label:'Glossary',             key:'glossary',           render:renderGlossary},
  {id:'reliability',label:'Reliability',          key:'reliability_explainer',render:renderReliability},
  {id:'versioning', label:'Grammar versioning',   key:'grammar_versioning', render:renderGrammarVersioning},
  {id:'faq',        label:'FAQ',                  key:'faq',                render:renderFaq},
  {id:'positioning',label:'Positioning',          key:'positioning',        render:renderPositioning},
  {id:'open',       label:'Open questions',       key:'open_questions',     render:renderOpen},
  {id:'roadmap',    label:'Supporting material',  key:'supporting_material_roadmap',render:renderRoadmap}
];

function secShell(s, inner){
  return '<section class="sec" id="'+s.id+'"><div class="sec-h">'+esc(s.label)+'</div>'+inner+'</section>';
}
function noteHTML(d){ return d && d.note ? '<p class="sec-note">'+rich(d.note)+'</p>' : ''; }

function renderComponents(d){
  var items=(d.items||[]).map(function(it){
    var body='<p class="stmt">'+rich(it.is)+'</p>';
    if(it.shapes && it.shapes.length){
      body+='<table class="tbl"><thead><tr><th>shape</th><th>how it is filled</th><th>examples</th></tr></thead><tbody>'
        +it.shapes.map(function(sh){
          return '<tr><td class="c1">'+rich(sh.shape)+'</td><td>'+rich(sh.mechanic)+'</td><td class="c3">'+rich(sh.examples)+'</td></tr>';
        }).join('')+'</tbody></table>';
    } else if(it.sections && it.sections.length){
      body+='<ol class="tmpl-list">'+it.sections.map(function(s){
        return '<li>'+rich(String(s).replace(/^\s*\d+\.\s*/,''))+'</li>';
      }).join('')+'</ol>';
    } else if(it.mechanic){
      body+='<p class="mech">'+rich(it.mechanic)+'</p>';
    }
    if(it.lifecycle) body+='<p class="reuse"><b>lifecycle</b> &nbsp;'+rich(it.lifecycle)+'</p>';
    if(it.reuse) body+='<p class="reuse"><b>reused</b> &nbsp;'+rich(it.reuse)+'</p>';
    return '<div class="pr"><div class="pr-h"><h3>'+rich(it.name)+'</h3></div>'+body+'</div>';
  }).join('');
  return noteHTML(d)+items;
}
function renderPrinciples(d){
  var items=(d.items||[]).map(function(it){
    var h='<div class="pr"><div class="pr-h"><h3>'+rich(it.name)+'</h3></div>';
    if(it.principle) h+='<p class="stmt">'+rich(it.principle)+'</p>';
    if(it.why) h+='<p class="reuse"><b>why</b> &nbsp;'+rich(it.why)+'</p>';
    return h+'</div>';
  }).join('');
  return noteHTML(d)+items;
}
function renderChecklist(d){
  var phases=(d.phases||[]).map(function(ph){
    var items=(ph.items||[]).map(function(it){return '<li>'+rich(it)+'</li>';}).join('');
    return '<div class="chk-phase"><p class="chk-phase-h">'+esc(ph.phase)+'</p><ul class="chk-items">'+items+'</ul></div>';
  }).join('');
  return noteHTML(d)+phases;
}
function renderPills(d){
  var h=noteHTML(d);
  var cr=d.cold_read_pill||d.crt_pill, vw=d.vs_wild_pill||d.instrument_pill; // renamed keys (S162), old names as fallback
  if(cr) h+='<div class="pill-card"><span class="pill-tag is-crt">Cold Read pill</span><p>'+rich(cr)+'</p></div>';
  if(vw) h+='<div class="pill-card"><span class="pill-tag is-inst">vs-Wild pill</span><p>'+rich(vw)+'</p></div>';
  if(d.text_exception) h+='<p class="exception">'+rich(d.text_exception)+'</p>';
  return h;
}
function renderFourChecks(d){
  var rows=(d.checks||[]).map(function(c){
    return '<tr><td class="c1">'+esc(c.name)+'</td><td>'+rich(c.asks)+'</td><td class="c3">'+esc(c.tests)+'</td><td class="c3">'+esc(c.on_card)+'</td></tr>';
  }).join('');
  var tbl='<table class="tbl"><thead><tr><th>check</th><th>asks</th><th>tests</th><th>on the card</th></tr></thead><tbody>'+rows+'</tbody></table>';
  var res=d.reserved?'<p class="exception"><b>'+esc(d.reserved.name)+':</b> '+rich(d.reserved.is)+'</p>':'';
  return noteHTML(d)+tbl+res;
}
function renderGlossary(d){
  var rows=(d.terms||[]).map(function(t){
    return '<div class="gterm"><dt>'+rich(t.term)+'</dt><dd>'+rich(t.def)+'</dd></div>';
  }).join('');
  return noteHTML(d)+'<div class="gloss"><dl>'+rows+'</dl></div>';
}
function renderReliability(d){
  var rows=[
    ['What the CRT pill certifies', d.crt_certifies],
    ['What the instrument pill certifies', d.instrument_pill_certifies],
    ['Where it is reliable', d.where_reliable],
    ['Where it is soft (named honestly)', d.where_soft],
    ['How disagreements are adjudicated', d.adjudication]
  ].filter(function(r){return r[1];}).map(function(r){
    return '<div class="kv"><p class="k">'+esc(r[0])+'</p><p class="v">'+rich(r[1])+'</p></div>';
  }).join('');
  return noteHTML(d)+rows;
}
function renderGrammarVersioning(d){
  var rows=[['Major (vN)',d.major],['Minor (vN.M)',d.minor],['Current',d.current],['What v3 is',d.v3_is]]
    .filter(function(r){return r[1];})
    .map(function(r){return '<div class="kv"><p class="k">'+esc(r[0])+'</p><p class="v">'+rich(r[1])+'</p></div>';}).join('');
  return noteHTML(d)+rows;
}
function renderFaq(d){
  var items=(d.items||[]).map(function(it){
    return '<details><summary>'+rich(it.q)+'</summary><div class="a">'+rich(it.a)+'</div></details>';
  }).join('');
  return noteHTML(d)+'<div class="faq">'+items+'</div>';
}
function renderPositioning(d){
  var rows=(d.vs||[]).map(function(v){
    return '<div class="vs"><p class="m">'+rich(v.method)+'</p><p class="n">'+rich(v.new)+'</p></div>';
  }).join('');
  return noteHTML(d)+rows;
}
function renderOpen(d){
  var rows=(d.items||[]).map(function(it){
    return '<div class="oq"><p class="q">'+rich(it.q)+'</p><p class="s">'+rich(it.state)+'</p></div>';
  }).join('');
  return noteHTML(d)+rows;
}
function renderRoadmap(d){
  var rows=(d.items||[]).map(function(it){
    var word=String(it.status||'').trim().split(/[\s(]/)[0].toLowerCase(); // BUILDING / PLANNED / DONE / SEEDED
    var cls={done:'is-done',building:'is-building',seeded:'is-seeded',planned:'is-planned'}[word]||'is-planned';
    return '<tr><td><span class="rbadge '+cls+'">'+esc(it.status)+'</span></td>'
      +'<td class="rt">'+rich(it.item)+'</td><td class="rw">'+rich(it.why)+'</td></tr>';
  }).join('');
  return noteHTML(d)+'<table class="rm"><tbody>'+rows+'</tbody></table>';
}

fetch('data/method_principles.json').then(function(r){if(!r.ok)throw new Error(r.status);return r.json();})
 .then(function(d){
   var p=d.page||{};
   if(p.title) document.getElementById('title').textContent=p.title;
   if(p.subtitle) document.getElementById('subtitle').textContent=p.subtitle;
   if(p.reads) document.getElementById('reads').textContent=p.reads;
   if(d.version) document.getElementById('ver').textContent='V'+d.version;

   // build the TOC from the sections that actually have data, in order
   var live=SECTIONS.filter(function(s){return d[s.key];});
   var toc=document.getElementById('toc');
   live.forEach(function(s){
     var a=document.createElement('a'); a.href='#'+s.id; a.textContent=s.label; toc.appendChild(a);
   });
   document.getElementById('sections').innerHTML=live.map(function(s){
     return secShell(s, s.render(d[s.key]));
   }).join('');
 })
 .catch(function(e){ document.getElementById('sections').innerHTML='<p class="err">could not load the method principles ('+e.message+').</p>'; });
</script>
</body></html>
