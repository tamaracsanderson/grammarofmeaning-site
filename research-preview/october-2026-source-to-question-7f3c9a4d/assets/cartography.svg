<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">Research Room and Cartography lay of the land</title>
  <desc id="desc">A nonproducing research terrain showing source roles, questions, coverage, analytical depth, missingness, and return paths.</desc>
  <defs><style>
    .bg{fill:#f5f1e8}.paper{fill:#fbf8f1;stroke:#cfc5b1;stroke-width:1.4}.ink{fill:#21372d}.muted{fill:#66736d}.line{stroke:#8da092;stroke-width:2;fill:none}.dashed{stroke:#b28a73;stroke-width:2;stroke-dasharray:8 7;fill:none}.green{fill:#dce8dd}.blue{fill:#dcebf0}.purple{fill:#eadfeb}.gold{fill:#f0e4c7}.rust{fill:#f1ddd5}
    .serif{font-family:Georgia,'Times New Roman',serif}.sans{font-family:Inter,Arial,sans-serif}.mono{font-family:Menlo,Consolas,monospace}.title{font-size:56px;font-weight:600}.sub{font-size:20px}.head{font-size:23px;font-weight:600}.node{font-size:17px;font-weight:700}.copy{font-size:14px}.tag{font-size:11px;font-weight:700;letter-spacing:1px}
  </style></defs>
  <rect width="1600" height="950" class="bg"/>
  <text x="58" y="72" class="serif title ink">How does a researcher see the lay of the land?</text>
  <text x="60" y="108" class="sans sub muted">Research Room is the workspace. Cartography is a nonproducing projection of exact, differently owned material.</text>
  <line x1="60" y1="138" x2="1540" y2="138" stroke="#cfc5b1" stroke-width="2"/>

  <g transform="translate(60,175)">
    <rect width="330" height="630" rx="16" class="paper"/>
    <text x="24" y="38" class="mono tag" fill="#8a4934">DECLARED RESEARCH QUESTION</text>
    <text x="24" y="82" class="serif head ink">What bears on body</text><text x="24" y="112" class="serif head ink">and identity in</text><text x="24" y="142" class="serif head ink">resurrection?</text>
    <line x1="24" y1="169" x2="306" y2="169" stroke="#cfc5b1"/>
    <text x="24" y="205" class="mono tag ink">HUMAN-OWNED ROUTE</text>
    <text x="24" y="235" class="sans copy muted">The question selects what to inspect.</text>
    <text x="24" y="257" class="sans copy muted">It does not make sources equivalent.</text>
    <g transform="translate(24,292)"><rect width="282" height="66" rx="10" class="green"/><text x="16" y="26" class="sans node ink">Research Inquiry</text><text x="16" y="48" class="sans copy muted">origin - target - why pursue</text></g>
    <g transform="translate(24,374)"><rect width="282" height="72" rx="10" class="gold"/><text x="16" y="26" class="sans node ink">Field Book</text><text x="16" y="48" class="sans copy muted">notes - questions - captures</text></g>
    <g transform="translate(24,462)"><rect width="282" height="90" rx="10" class="purple"/><text x="16" y="26" class="sans node ink">Human Interpretive Record</text><text x="16" y="49" class="sans copy muted">deliberate, versioned human view</text><text x="16" y="70" class="sans copy muted">not auto-populated by inquiry</text></g>
    <text x="24" y="595" class="sans copy muted">Workspace ownership remains human.</text>
  </g>

  <g transform="translate(430,175)">
    <rect width="720" height="630" rx="16" fill="#eef1ea" stroke="#cfc5b1" stroke-width="1.4"/>
    <text x="24" y="38" class="mono tag ink">RESEARCH CARTOGRAPHY - NONPRODUCING</text>
    <text x="24" y="72" class="serif head ink">Exact roles, unequal depth, visible limits</text>
    <path d="M360 125L160 210M360 125L360 210M360 125L560 210M160 275L90 365M160 275L230 365M360 275L340 365M360 275L455 365M560 275L580 365M560 275L660 365" class="line"/>
    <path d="M230 425L300 505M455 425L420 505M580 425L540 505" class="dashed"/>
    <g transform="translate(270,92)"><rect width="180" height="66" rx="33" fill="#21372d"/><text x="90" y="29" text-anchor="middle" class="sans node" fill="#f5f1e8">Question</text><text x="90" y="49" text-anchor="middle" class="mono tag" fill="#dce8dd">SELECTION, NOT ANSWER</text></g>
    <g transform="translate(70,210)"><rect width="180" height="66" rx="10" class="green"/><text x="90" y="28" text-anchor="middle" class="sans node ink">Scriptural sources</text><text x="90" y="49" text-anchor="middle" class="sans copy muted">Mark - Matthew - Paul</text></g>
    <g transform="translate(270,210)"><rect width="180" height="66" rx="10" class="gold"/><text x="90" y="28" text-anchor="middle" class="sans node ink">Historical witness</text><text x="90" y="49" text-anchor="middle" class="sans copy muted">Justin - attribution unsettled</text></g>
    <g transform="translate(470,210)"><rect width="180" height="66" rx="10" class="blue"/><text x="90" y="28" text-anchor="middle" class="sans node ink">Scholarship</text><text x="90" y="49" text-anchor="middle" class="sans copy muted">Rowe - secondary synthesis</text></g>
    <g transform="translate(20,365)"><rect width="140" height="60" rx="10" class="paper"/><text x="70" y="26" text-anchor="middle" class="sans node ink">Source unit</text><text x="70" y="46" text-anchor="middle" class="mono tag muted">EXACT RETURN</text></g>
    <g transform="translate(170,365)"><rect width="140" height="60" rx="10" class="paper"/><text x="70" y="26" text-anchor="middle" class="sans node ink">Move / Position</text><text x="70" y="46" text-anchor="middle" class="mono tag muted">ANALYTICAL REF</text></g>
    <g transform="translate(320,365)"><rect width="140" height="60" rx="10" class="paper"/><text x="70" y="26" text-anchor="middle" class="sans node ink">Participation</text><text x="70" y="46" text-anchor="middle" class="mono tag muted">0 PROPOSITIONS OK</text></g>
    <g transform="translate(470,365)"><rect width="140" height="60" rx="10" class="paper"/><text x="70" y="26" text-anchor="middle" class="sans node ink">Owned claim</text><text x="70" y="46" text-anchor="middle" class="mono tag muted">EVIDENCE ENVELOPE</text></g>
    <g transform="translate(620,365)"><rect width="80" height="60" rx="10" class="paper"/><text x="40" y="26" text-anchor="middle" class="sans node ink">Status</text><text x="40" y="46" text-anchor="middle" class="mono tag muted">VISIBLE</text></g>
    <g transform="translate(120,505)"><rect width="480" height="82" rx="12" class="rust"/><text x="240" y="29" text-anchor="middle" class="sans node ink">Unformed historical relation slots remain visible</text><text x="240" y="52" text-anchor="middle" class="sans copy muted">No Reception, dependence, agreement, or shared meaning inferred.</text><text x="240" y="70" text-anchor="middle" class="mono tag" fill="#8a4934">5 HISTORICAL SLOTS UNFORMED</text></g>
  </g>

  <g transform="translate(1190,175)">
    <rect width="350" height="630" rx="16" class="paper"/>
    <text x="24" y="38" class="mono tag ink">QUESTIONS THE TERRAIN ANSWERS</text>
    <g transform="translate(24,72)"><rect width="302" height="82" rx="10" class="green"/><text x="18" y="27" class="serif head ink">What have I looked at?</text><text x="18" y="51" class="sans copy muted">Exact sources, units, notes,</text><text x="18" y="69" class="sans copy muted">and processing depth.</text></g>
    <g transform="translate(24,170)"><rect width="302" height="82" rx="10" class="rust"/><text x="18" y="27" class="serif head ink">What is missing?</text><text x="18" y="51" class="sans copy muted">Coverage, rights, processing,</text><text x="18" y="69" class="sans copy muted">evidence, or relation.</text></g>
    <g transform="translate(24,268)"><rect width="302" height="82" rx="10" class="blue"/><text x="18" y="27" class="serif head ink">What bears on this?</text><text x="18" y="51" class="sans copy muted">Sources and scholarship by role,</text><text x="18" y="69" class="sans copy muted">not by collapse.</text></g>
    <g transform="translate(24,366)"><rect width="302" height="82" rx="10" class="purple"/><text x="18" y="27" class="serif head ink">Where might I look next?</text><text x="18" y="51" class="sans copy muted">A proposed frontier,</text><text x="18" y="69" class="sans copy muted">never an automatic inquiry.</text></g>
    <g transform="translate(24,478)"><rect width="302" height="104" rx="10" fill="#21372d"/><text x="18" y="29" class="serif head" fill="#f5f1e8">Can I return?</text><text x="18" y="53" class="sans copy" fill="#dce8dd">Every item carries exact identity,</text><text x="18" y="72" class="sans copy" fill="#dce8dd">owner, grain, status, evidence,</text><text x="18" y="91" class="sans copy" fill="#dce8dd">and source return path.</text></g>
  </g>
  <text x="60" y="865" class="mono tag muted">CURRENT REFERENCE FIXTURE: 19 EXACT/STATUS REFERENCES - 16 STRUCTURAL LINKS - 5 HISTORICAL SLOTS UNFORMED - 44/44 VALIDATION</text>
  <text x="60" y="900" class="serif" font-size="22" fill="#21372d">Cartography makes the research terrain inspectable. It does not own or generate the propositions it displays.</text>
</svg>
