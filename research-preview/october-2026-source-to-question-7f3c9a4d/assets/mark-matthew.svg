<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="950" viewBox="0 0 1600 950" role="img" aria-labelledby="title desc">
  <title id="title">Mark 16 and Matthew 28 progress view</title>
  <desc id="desc">Two independent Gospel cases shown side by side to test instrument travel, not to make a Gospel comparison.</desc>
  <defs><style>
    .bg{fill:#f5f1e8}.paper{fill:#fbf8f1;stroke:#cfc5b1;stroke-width:1.5}.ink{fill:#21372d}.muted{fill:#66736d}.green{fill:#355943}.blue{fill:#245d70}.rust{fill:#8a4934}.gray{fill:#7c766a}.softg{fill:#dce8dd}.softb{fill:#dcebf0}.line{stroke:#cfc5b1;stroke-width:2}
    .serif{font-family:Georgia,'Times New Roman',serif}.sans{font-family:Inter,Arial,sans-serif}.mono{font-family:Menlo,Consolas,monospace}.title{font-size:42px;font-weight:600}.sub{font-size:21px}.case{font-size:35px;font-weight:600}.row{font-size:18px;font-weight:700}.copy{font-size:14px}.status{font-size:11px;font-weight:700;letter-spacing:1px}.tag{font-size:12px;font-weight:700;letter-spacing:1px}
  </style></defs>
  <rect width="1600" height="950" class="bg"/>
  <text x="60" y="75" class="serif title ink">From one primary case to two independent cases</text>
  <text x="62" y="112" class="sans sub muted">A test of instrument travel - adjacency here is not Gospel comparison.</text>
  <rect x="1212" y="51" width="326" height="50" rx="25" fill="#eadfeb"/><text x="1375" y="81" text-anchor="middle" class="mono tag" fill="#68466d">NO HARMONIZATION OR DEPENDENCE CLAIM</text>
  <line x1="60" y1="143" x2="1540" y2="143" class="line"/>

  <g transform="translate(60,175)">
    <rect width="700" height="650" rx="18" class="paper"/>
    <rect width="700" height="110" rx="18" class="softg"/><rect y="92" width="700" height="18" class="softg"/>
    <text x="28" y="39" class="mono tag ink">PRIMARY CASE</text><text x="28" y="82" class="serif case ink">Mark 16:1-8</text>
    <g transform="translate(28,134)">
      <g><text y="24" class="sans row ink">Governed Chunk</text><rect x="474" y="4" width="156" height="30" rx="15" class="green"/><text x="552" y="24" text-anchor="middle" fill="#fff" class="mono status">GOVERNED SOURCE</text></g>
      <line x1="0" y1="49" x2="644" y2="49" class="line"/>
      <g transform="translate(0,62)"><text y="24" class="sans row ink">Decompose</text><text x="170" y="24" class="sans copy muted">20 bounded Moves</text><rect x="486" y="4" width="144" height="30" rx="15" class="blue"/><text x="558" y="24" text-anchor="middle" fill="#fff" class="mono status">DEMO PROVISIONAL</text></g>
      <line x1="0" y1="111" x2="644" y2="111" class="line"/>
      <g transform="translate(0,124)"><text y="24" class="sans row ink">Position</text><text x="170" y="24" class="sans copy muted">whole-Chunk observation available</text><rect x="486" y="4" width="144" height="30" rx="15" class="blue"/><text x="558" y="24" text-anchor="middle" fill="#fff" class="mono status">DEMO PROVISIONAL</text></g>
      <line x1="0" y1="173" x2="644" y2="173" class="line"/>
      <g transform="translate(0,186)"><text y="24" class="sans row ink">Situate</text><text x="170" y="18" class="sans copy muted">SitZ validated</text><text x="170" y="39" class="sans copy muted">Transmission: typed noncompletion</text><rect x="515" y="4" width="115" height="30" rx="15" class="blue"/><text x="572" y="24" text-anchor="middle" fill="#fff" class="mono status">MIXED</text></g>
      <line x1="0" y1="247" x2="644" y2="247" class="line"/>
      <g transform="translate(0,260)"><text y="24" class="sans row ink">Connect</text><text x="170" y="18" class="sans copy muted">M004 &lt;-&gt; M011 assessed</text><text x="170" y="39" class="sans copy muted">17 unsupported rows - 0 edges; Shape failed closed</text><rect x="515" y="4" width="115" height="30" rx="15" class="rust"/><text x="572" y="24" text-anchor="middle" fill="#fff" class="mono status">LIMITED</text></g>
      <line x1="0" y1="321" x2="644" y2="321" class="line"/>
      <g transform="translate(0,334)"><text y="24" class="sans row ink">Reading Record</text><text x="170" y="18" class="sans copy muted">10-slot record formed</text><text x="170" y="39" class="sans copy muted">Form-populated successor; noncurrent</text><rect x="486" y="4" width="144" height="30" rx="15" class="blue"/><text x="558" y="24" text-anchor="middle" fill="#fff" class="mono status">DEMO PROVISIONAL</text></g>
    </g>
    <rect x="28" y="538" width="644" height="78" rx="10" fill="#21372d"/><text x="50" y="569" class="serif" font-size="22" fill="#f5f1e8">What Mark now provides</text><text x="50" y="596" class="sans copy" fill="#dce8dd">One bounded assembled record plus inspectable positive, negative, and failed states.</text>
  </g>

  <g transform="translate(840,175)">
    <rect width="700" height="650" rx="18" class="paper"/>
    <rect width="700" height="110" rx="18" class="softb"/><rect y="92" width="700" height="18" class="softb"/>
    <text x="28" y="39" class="mono tag ink">SECOND INDEPENDENT CASE</text><text x="28" y="82" class="serif case ink">Matthew 28:1-10</text>
    <g transform="translate(28,134)">
      <g><text y="24" class="sans row ink">Governed Chunk</text><rect x="474" y="4" width="156" height="30" rx="15" class="green"/><text x="552" y="24" text-anchor="middle" fill="#fff" class="mono status">ADOPTED CURRENT</text></g>
      <line x1="0" y1="49" x2="644" y2="49" class="line"/>
      <g transform="translate(0,62)"><text y="24" class="sans row ink">Decompose</text><text x="170" y="18" class="sans copy muted">38 Moves - 10/10 source units</text><text x="170" y="39" class="sans copy muted">formed without Mark results</text><rect x="486" y="4" width="144" height="30" rx="15" class="blue"/><text x="558" y="24" text-anchor="middle" fill="#fff" class="mono status">DEMO PROVISIONAL</text></g>
      <line x1="0" y1="111" x2="644" y2="111" class="line"/>
      <g transform="translate(0,124)"><text y="24" class="sans row ink">Position</text><text x="170" y="24" class="sans copy muted">validated whole-Chunk observation</text><rect x="486" y="4" width="144" height="30" rx="15" class="blue"/><text x="558" y="24" text-anchor="middle" fill="#fff" class="mono status">DEMO PROVISIONAL</text></g>
      <line x1="0" y1="173" x2="644" y2="173" class="line"/>
      <g transform="translate(0,186)"><text y="24" class="sans row ink">Situate</text><text x="170" y="18" class="sans copy muted">whole-work SitZ validated</text><text x="170" y="39" class="sans copy muted">Transmission: failed before observation</text><rect x="515" y="4" width="115" height="30" rx="15" class="blue"/><text x="572" y="24" text-anchor="middle" fill="#fff" class="mono status">MIXED</text></g>
      <line x1="0" y1="247" x2="644" y2="247" class="line"/>
      <g transform="translate(0,260)"><text y="24" class="sans row ink">Connect</text><text x="170" y="18" class="sans copy muted">three infrastructure failures</text><text x="170" y="39" class="sans copy muted">Linkage observations: 0</text><rect x="482" y="4" width="148" height="30" rx="15" class="rust"/><text x="556" y="24" text-anchor="middle" fill="#fff" class="mono status">FAILED CLOSED</text></g>
      <line x1="0" y1="321" x2="644" y2="321" class="line"/>
      <g transform="translate(0,334)"><text y="24" class="sans row ink">Reading Record</text><text x="170" y="18" class="sans copy muted">not formed</text><text x="170" y="39" class="sans copy muted">positive Linkage requirement remains a hold</text><rect x="494" y="4" width="136" height="30" rx="15" class="gray"/><text x="562" y="24" text-anchor="middle" fill="#fff" class="mono status">NOT FORMED</text></g>
    </g>
    <rect x="28" y="538" width="644" height="78" rx="10" fill="#21372d"/><text x="50" y="569" class="serif" font-size="22" fill="#f5f1e8">What Matthew begins to test</text><text x="50" y="596" class="sans copy" fill="#dcebf0">The instrument can travel beyond its first passage - but not every lane travels yet.</text>
  </g>

  <g transform="translate(60,852)"><rect width="1480" height="58" rx="10" fill="#eadfeb"/><text x="740" y="25" text-anchor="middle" class="serif" font-size="20" fill="#21372d">What adjacency establishes: two independent bounded cases now exist.</text><text x="740" y="45" text-anchor="middle" class="sans copy" fill="#68466d">What it does not establish: shared meaning, source dependence, harmonization, redaction, or a completed comparative benchmark.</text></g>
</svg>
