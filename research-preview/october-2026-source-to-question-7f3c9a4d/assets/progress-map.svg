<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Grammar of Meaning research instrument map, October 5, 2026</title>
  <desc id="desc">Five-stage architecture from governed source through analysis, relation, research, and reader, with exact maturity labels.</desc>
  <defs>
    <style>
      .bg{fill:#f5f1e8}.ink{fill:#21372d}.muted{fill:#66736d}.line{stroke:#cfc5b1;stroke-width:2}.arrow{stroke:#63756a;stroke-width:3;fill:none;marker-end:url(#a)}
      .serif{font-family:Georgia,'Times New Roman',serif}.sans{font-family:Inter,Arial,sans-serif}.mono{font-family:Menlo,Consolas,monospace}
      .title{font-size:62px;font-weight:600}.sub{font-size:22px}.coltitle{font-size:19px;font-weight:600}.stage{font-size:13px;font-weight:700;letter-spacing:2px}.cardtitle{font-size:18px;font-weight:700}.copy{font-size:14px}.status{font-size:11px;font-weight:700;letter-spacing:1px}
      .source{fill:#f0e4c7}.analysis{fill:#dcebf0}.relation{fill:#eadfeb}.research{fill:#dce8dd}.reader{fill:#efe5c9}
      .paper{fill:#fbf8f1;stroke:#cfc5b1;stroke-width:1.5}.current{fill:#355943}.validated{fill:#245d70}.prototype{fill:#68466d}.failed{fill:#8a4934}.planned{fill:#7c766a}
    </style>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#63756a"/></marker>
  </defs>
  <rect class="bg" width="1600" height="1100"/>
  <text x="54" y="80" class="serif title ink">Grammar of Meaning</text>
  <text x="57" y="118" class="sans sub muted">A source-first research instrument - October 5, 2026</text>
  <text x="1545" y="72" text-anchor="end" class="serif sub muted" font-style="italic">The grammar unpacks; it does not assign meaning.</text>
  <line x1="54" y1="148" x2="1546" y2="148" class="line"/>

  <g transform="translate(42,180)">
    <rect x="0" y="0" width="284" height="730" rx="16" class="source" opacity=".72"/>
    <text x="22" y="42" class="mono stage ink">1 - GOVERNED SOURCE</text>
    <text x="22" y="78" class="serif coltitle ink">Start with exact custody</text>
    <g transform="translate(18,105)">
      <rect width="248" height="94" rx="10" class="paper"/>
      <text x="16" y="28" class="sans cardtitle ink">Library / holding</text>
      <text x="16" y="51" class="sans copy muted">edition - rights - provenance</text>
      <rect x="16" y="65" width="88" height="20" rx="10" class="current"/><text x="60" y="79" text-anchor="middle" fill="#fff" class="mono status">CURRENT</text>
    </g>
    <g transform="translate(18,216)">
      <rect width="248" height="116" rx="10" class="paper"/>
      <text x="16" y="28" class="sans cardtitle ink">Chunk</text>
      <text x="16" y="51" class="sans copy muted">Mark 16:1-8</text><text x="16" y="70" class="sans copy muted">Matthew 28:1-10</text>
      <rect x="16" y="84" width="88" height="20" rx="10" class="current"/><text x="60" y="98" text-anchor="middle" fill="#fff" class="mono status">CURRENT</text>
    </g>
    <text x="22" y="390" class="serif" font-size="20" fill="#21372d">Every later object retains</text>
    <text x="22" y="418" class="serif" font-size="20" fill="#21372d">a return path to source.</text>
    <text x="22" y="475" class="sans copy muted">Source absence, store absence,</text>
    <text x="22" y="497" class="sans copy muted">query miss, and retrieval miss</text>
    <text x="22" y="519" class="sans copy muted">remain different states.</text>
  </g>

  <g transform="translate(345,180)">
    <rect width="284" height="730" rx="16" class="analysis" opacity=".8"/>
    <text x="22" y="42" class="mono stage ink">2 - ANALYSIS</text>
    <text x="22" y="78" class="serif coltitle ink">Ask distinct questions</text>
    <g transform="translate(18,105)"><rect width="248" height="100" rx="10" class="paper"/><text x="16" y="28" class="sans cardtitle ink">Decompose</text><text x="16" y="51" class="sans copy muted">20 Mark Moves - 38 Matthew</text><rect x="16" y="67" width="104" height="20" rx="10" class="validated"/><text x="68" y="81" text-anchor="middle" fill="#fff" class="mono status">VALIDATED</text></g>
    <g transform="translate(18,220)"><rect width="248" height="94" rx="10" class="paper"/><text x="16" y="28" class="sans cardtitle ink">Position</text><text x="16" y="51" class="sans copy muted">whole-Chunk orientation</text><rect x="16" y="64" width="104" height="20" rx="10" class="validated"/><text x="68" y="78" text-anchor="middle" fill="#fff" class="mono status">VALIDATED</text></g>
    <g transform="translate(18,329)"><rect width="248" height="120" rx="10" class="paper"/><text x="16" y="28" class="sans cardtitle ink">Situate</text><text x="16" y="51" class="sans copy muted">SitZ observations formed</text><text x="16" y="70" class="sans copy muted">Transmission incomplete</text><rect x="16" y="87" width="74" height="20" rx="10" class="validated"/><text x="53" y="101" text-anchor="middle" fill="#fff" class="mono status">MIXED</text></g>
    <g transform="translate(18,464)"><rect width="248" height="110" rx="10" class="paper"/><text x="16" y="28" class="sans cardtitle ink">Handle research</text><text x="16" y="51" class="sans copy muted">lexical - historical - entity</text><rect x="16" y="72" width="108" height="20" rx="10" class="prototype"/><text x="70" y="86" text-anchor="middle" fill="#fff" class="mono status">PROTOTYPE</text></g>
  </g>

  <g transform="translate(648,180)">
    <rect width="284" height="730" rx="16" class="relation" opacity=".78"/>
    <text x="22" y="42" class="mono stage ink">3 - RELATION / LIMIT</text>
    <text x="22" y="78" class="serif coltitle ink">Connect without collapse</text>
    <g transform="translate(18,105)"><rect width="248" height="118" rx="10" class="paper"/><text x="16" y="28" class="sans cardtitle ink">Connect</text><text x="16" y="51" class="sans copy muted">Mark: 17 rows, 0 edges</text><text x="16" y="70" class="sans copy muted">Matthew: no observation</text><rect x="16" y="88" width="92" height="20" rx="10" class="failed"/><text x="62" y="102" text-anchor="middle" fill="#fff" class="mono status">LIMITED</text></g>
    <g transform="translate(18,238)"><rect width="248" height="96" rx="10" class="paper"/><text x="16" y="28" class="sans cardtitle ink">Gap</text><text x="16" y="51" class="sans copy muted">OPAQUE x IN_FOCUS</text><rect x="16" y="66" width="108" height="20" rx="10" class="prototype"/><text x="70" y="80" text-anchor="middle" fill="#fff" class="mono status">PROTOTYPE</text></g>
    <g transform="translate(18,349)"><rect width="248" height="104" rx="10" class="paper"/><text x="16" y="28" class="sans cardtitle ink">Compare</text><text x="16" y="51" class="sans copy muted">warrant before comparison</text><rect x="16" y="69" width="146" height="20" rx="10" class="prototype"/><text x="89" y="83" text-anchor="middle" fill="#fff" class="mono status">NONPERSISTENT</text></g>
    <g transform="translate(18,468)"><rect width="248" height="118" rx="10" class="paper"/><text x="16" y="28" class="sans cardtitle ink">Reception / Trace</text><text x="16" y="51" class="sans copy muted">later interpretation / use</text><text x="16" y="70" class="sans copy muted">navigation is nonproducing</text><rect x="16" y="88" width="108" height="20" rx="10" class="prototype"/><text x="70" y="102" text-anchor="middle" fill="#fff" class="mono status">SYNTHETIC</text></g>
    <g transform="translate(18,601)"><rect width="248" height="94" rx="10" class="paper"/><text x="16" y="28" class="sans cardtitle ink">Gloss</text><text x="16" y="51" class="sans copy muted">evidence-bounded route</text><rect x="16" y="64" width="96" height="20" rx="10" class="planned"/><text x="64" y="78" text-anchor="middle" fill="#fff" class="mono status">NO OBJECT</text></g>
  </g>

  <g transform="translate(951,180)">
    <rect width="284" height="730" rx="16" class="research" opacity=".78"/>
    <text x="22" y="42" class="mono stage ink">4 - RECOMPOSE / RESEARCH</text>
    <text x="22" y="78" class="serif coltitle ink">Gather around questions</text>
    <g transform="translate(18,105)"><rect width="248" height="112" rx="10" class="paper"/><text x="16" y="28" class="sans cardtitle ink">Reading Record</text><text x="16" y="51" class="sans copy muted">Mark: 10 slots + Form successor</text><text x="16" y="70" class="sans copy muted">Matthew: not formed</text><rect x="16" y="83" width="130" height="20" rx="10" class="validated"/><text x="81" y="97" text-anchor="middle" fill="#fff" class="mono status">DEMO PROVISIONAL</text></g>
    <g transform="translate(18,232)"><rect width="248" height="94" rx="10" class="paper"/><text x="16" y="28" class="sans cardtitle ink">Research Inquiry</text><text x="16" y="51" class="sans copy muted">human-selected question</text><rect x="16" y="64" width="146" height="20" rx="10" class="prototype"/><text x="89" y="78" text-anchor="middle" fill="#fff" class="mono status">NONPERSISTENT</text></g>
    <g transform="translate(18,341)"><rect width="248" height="104" rx="10" class="paper"/><text x="16" y="28" class="sans cardtitle ink">Cartography</text><text x="16" y="51" class="sans copy muted">terrain - coverage - provenance</text><rect x="16" y="69" width="122" height="20" rx="10" class="current"/><text x="77" y="83" text-anchor="middle" fill="#fff" class="mono status">CURRENT MAP</text></g>
    <g transform="translate(18,460)"><rect width="248" height="112" rx="10" class="paper"/><text x="16" y="28" class="sans cardtitle ink">Question-led return</text><text x="16" y="51" class="sans copy muted">whole - parts - collation</text><text x="16" y="70" class="sans copy muted">difference - silence - whole</text><rect x="16" y="83" width="108" height="20" rx="10" class="prototype"/><text x="70" y="97" text-anchor="middle" fill="#fff" class="mono status">PROTOTYPE</text></g>
  </g>

  <g transform="translate(1254,180)">
    <rect width="304" height="730" rx="16" class="reader" opacity=".78"/>
    <text x="22" y="42" class="mono stage ink">5 - READER / RESEARCHER</text>
    <text x="22" y="78" class="serif coltitle ink">Return to human use</text>
    <g transform="translate(18,105)"><rect width="268" height="96" rx="10" class="paper"/><text x="16" y="28" class="sans cardtitle ink">Reading Room</text><text x="16" y="51" class="sans copy muted">source-first reader encounter</text><rect x="16" y="66" width="96" height="20" rx="10" class="prototype"/><text x="64" y="80" text-anchor="middle" fill="#fff" class="mono status">FROZEN UI</text></g>
    <g transform="translate(18,216)"><rect width="268" height="96" rx="10" class="paper"/><text x="16" y="28" class="sans cardtitle ink">Reading Record Inspector</text><text x="16" y="51" class="sans copy muted">what the instrument produced</text><rect x="16" y="66" width="88" height="20" rx="10" class="prototype"/><text x="60" y="80" text-anchor="middle" fill="#fff" class="mono status">LOCAL</text></g>
    <g transform="translate(18,327)"><rect width="268" height="112" rx="10" class="paper"/><text x="16" y="28" class="sans cardtitle ink">Research Room</text><text x="16" y="51" class="sans copy muted">workspace for sources, notes, maps</text><text x="16" y="70" class="sans copy muted">backend not deployed</text><rect x="16" y="83" width="108" height="20" rx="10" class="prototype"/><text x="70" y="97" text-anchor="middle" fill="#fff" class="mono status">PROTOTYPE</text></g>
    <g transform="translate(18,454)"><rect width="268" height="96" rx="10" class="paper"/><text x="16" y="28" class="sans cardtitle ink">Field Book</text><text x="16" y="51" class="sans copy muted">human notebook - thinking in motion</text><rect x="16" y="66" width="102" height="20" rx="10" class="planned"/><text x="67" y="80" text-anchor="middle" fill="#fff" class="mono status">PROSPECTIVE</text></g>
    <g transform="translate(18,565)"><rect width="268" height="112" rx="10" class="paper"/><text x="16" y="28" class="sans cardtitle ink">Human Interpretive Record</text><text x="16" y="51" class="sans copy muted">versioned human interpretation</text><text x="16" y="70" class="sans copy muted">two-snapshot synthetic pilot</text><rect x="16" y="83" width="108" height="20" rx="10" class="prototype"/><text x="70" y="97" text-anchor="middle" fill="#fff" class="mono status">SYNTHETIC</text></g>
  </g>

  <path d="M326 540H343" class="arrow"/><path d="M629 540H646" class="arrow"/><path d="M932 540H949" class="arrow"/><path d="M1235 540H1252" class="arrow"/>
  <g transform="translate(54,950)">
    <text x="0" y="18" class="mono stage ink">MATURITY LEGEND</text>
    <circle cx="205" cy="13" r="8" class="current"/><text x="222" y="18" class="sans copy ink">adopted/current in named scope</text>
    <circle cx="495" cy="13" r="8" class="validated"/><text x="512" y="18" class="sans copy ink">validated demo-provisional</text>
    <circle cx="755" cy="13" r="8" class="prototype"/><text x="772" y="18" class="sans copy ink">prototype/nonpersistent</text>
    <circle cx="1015" cy="13" r="8" class="failed"/><text x="1032" y="18" class="sans copy ink">failed closed / no object</text>
    <circle cx="1280" cy="13" r="8" class="planned"/><text x="1297" y="18" class="sans copy ink">prospective / not formed</text>
  </g>
  <rect x="54" y="1004" width="1492" height="56" rx="10" fill="#21372d"/>
  <text x="800" y="1039" text-anchor="middle" class="serif" font-size="24" fill="#f5f1e8">Accountability surrounds every stage: exact source, owner, evidence, status, provenance, and honest noncompletion.</text>
</svg>
