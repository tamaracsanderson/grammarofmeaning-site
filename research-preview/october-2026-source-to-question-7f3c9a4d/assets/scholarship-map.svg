<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Scholarship to functionality map</title>
  <desc id="desc">Direct reading and prior art create bounded architecture pressure without automatic Method adoption.</desc>
  <defs><style>
    .bg{fill:#f5f1e8}.paper{fill:#fbf8f1;stroke:#cfc5b1;stroke-width:1.5}.ink{fill:#21372d}.muted{fill:#66736d}.source{fill:#f0e4c7}.pressure{fill:#eadfeb}.function{fill:#dce8dd}.guard{fill:#dcebf0}.arrow{stroke:#8a705f;stroke-width:2.5;stroke-dasharray:8 6;fill:none;marker-end:url(#a)}.line{stroke:#cfc5b1;stroke-width:2}
    .serif{font-family:Georgia,'Times New Roman',serif}.sans{font-family:Inter,Arial,sans-serif}.mono{font-family:Menlo,Consolas,monospace}.title{font-size:58px;font-weight:600}.sub{font-size:20px}.head{font-size:23px;font-weight:600}.name{font-size:20px;font-weight:700}.copy{font-size:14px}.tag{font-size:11px;font-weight:700;letter-spacing:1px}
  </style><marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9Z" fill="#8a705f"/></marker></defs>
  <rect width="1600" height="980" class="bg"/>
  <text x="58" y="74" class="serif title ink">The reading is changing the design</text>
  <text x="60" y="111" class="sans sub muted">Direct sources and disciplinary prior art create bounded pressure, prototypes, and safeguards - not automatic Method authority.</text>
  <line x1="60" y1="140" x2="1540" y2="140" class="line"/>
  <text x="60" y="180" class="mono tag ink">DIRECT READING / PRIOR ART</text>
  <text x="586" y="180" class="mono tag ink">ARCHITECTURE PRESSURE</text>
  <text x="1080" y="180" class="mono tag ink">VISIBLE GOM CONSEQUENCE</text>

  <g transform="translate(60,210)">
    <g><rect width="420" height="100" rx="12" class="source"/><text x="18" y="31" class="sans name ink">Friedrich Ast</text><text x="18" y="56" class="sans copy muted">part and whole; analytic differentiation;</text><text x="18" y="78" class="sans copy muted">interpretation exceeds mechanical parsing</text></g>
    <g transform="translate(0,116)"><rect width="420" height="100" rx="12" class="source"/><text x="18" y="31" class="sans name ink">F. Schleiermacher</text><text x="18" y="56" class="sans copy muted">grammatical / technical reading;</text><text x="18" y="78" class="sans copy muted">divinatory / comparative; circular evidence</text></g>
    <g transform="translate(0,232)"><rect width="420" height="100" rx="12" class="source"/><text x="18" y="31" class="sans name ink">Wilhelm Dilthey</text><text x="18" y="56" class="sans copy muted">historical language; nonterminable understanding;</text><text x="18" y="78" class="sans copy muted">limits of author-consciousness claims</text></g>
    <g transform="translate(0,348)"><rect width="420" height="100" rx="12" class="source"/><text x="18" y="31" class="sans name ink">C. Kavin Rowe</text><text x="18" y="56" class="sans copy muted">modern secondary synthesis within the</text><text x="18" y="78" class="sans copy muted">resurrection research terrain</text></g>
    <g transform="translate(0,464)"><rect width="420" height="100" rx="12" class="source"/><text x="18" y="31" class="sans name ink">Form / SitZ scholarship</text><text x="18" y="56" class="sans copy muted">literary form is not social setting;</text><text x="18" y="78" class="sans copy muted">historical claims require independent evidence</text></g>
    <g transform="translate(0,580)"><rect width="420" height="100" rx="12" class="source"/><text x="18" y="31" class="sans name ink">Linguistic / event prior art</text><text x="18" y="56" class="sans copy muted">roles, purpose, subordinate events, adjuncts,</text><text x="18" y="78" class="sans copy muted">event-to-event and discourse relations</text></g>
  </g>

  <g transform="translate(560,210)">
    <g><rect width="400" height="100" rx="12" class="pressure"/><text x="18" y="31" class="sans name ink">Reversible part - whole movement</text><text x="18" y="57" class="sans copy muted">Analysis must not become the endpoint.</text></g>
    <g transform="translate(0,116)"><rect width="400" height="100" rx="12" class="pressure"/><text x="18" y="31" class="sans name ink">Research-lens discipline</text><text x="18" y="57" class="sans copy muted">A declared lens may constrain inquiry;</text><text x="18" y="79" class="sans copy muted">it does not become source Position.</text></g>
    <g transform="translate(0,232)"><rect width="400" height="100" rx="12" class="pressure"/><text x="18" y="31" class="sans name ink">Interpretive ownership and nonclosure</text><text x="18" y="57" class="sans copy muted">Human return and uncertainty remain visible.</text></g>
    <g transform="translate(0,348)"><rect width="400" height="100" rx="12" class="pressure"/><text x="18" y="31" class="sans name ink">Source-role differentiation</text><text x="18" y="57" class="sans copy muted">Primary text, historical witness, and</text><text x="18" y="79" class="sans copy muted">secondary scholarship do not collapse.</text></g>
    <g transform="translate(0,464)"><rect width="400" height="100" rx="12" class="pressure"/><text x="18" y="31" class="sans name ink">Historical warrant boundary</text><text x="18" y="57" class="sans copy muted">Form, SitZ, Transmission, and Lineage</text><text x="18" y="79" class="sans copy muted">require different evidence and owners.</text></g>
    <g transform="translate(0,580)"><rect width="400" height="100" rx="12" class="pressure"/><text x="18" y="31" class="sans name ink">Internal vs cross-Move structure</text><text x="18" y="57" class="sans copy muted">Purpose and nesting remain inside a Move;</text><text x="18" y="79" class="sans copy muted">Connect owns warranted cross-Move relations.</text></g>
  </g>

  <g transform="translate(1040,210)">
    <g><rect width="500" height="100" rx="12" class="function"/><text x="18" y="31" class="sans name ink">Question-led recomposition</text><text x="18" y="57" class="sans copy muted">Whole - parts - collation - difference / silence - return.</text><text x="18" y="79" class="mono tag" fill="#355943">SYNTHETIC NONPRODUCING PROTOTYPE</text></g>
    <g transform="translate(0,116)"><rect width="500" height="100" rx="12" class="function"/><text x="18" y="31" class="sans name ink">Position-derived research-lens toggle</text><text x="18" y="57" class="sans copy muted">Improves evidence / inference / unknown discipline.</text><text x="18" y="79" class="mono tag" fill="#355943">OPTIONAL PROTOTYPE CONDITION</text></g>
    <g transform="translate(0,232)"><rect width="500" height="100" rx="12" class="function"/><text x="18" y="31" class="sans name ink">Human Interpretive Record</text><text x="18" y="57" class="sans copy muted">Two immutable human-authored snapshots; no belief inference.</text><text x="18" y="79" class="mono tag" fill="#355943">SYNTHETIC OFFLINE PILOT</text></g>
    <g transform="translate(0,348)"><rect width="500" height="100" rx="12" class="function"/><text x="18" y="31" class="sans name ink">Inquiry collation and coverage contracts</text><text x="18" y="57" class="sans copy muted">Rowe stays secondary; Justin may participate with 0 propositions.</text><text x="18" y="79" class="mono tag" fill="#355943">ADOPTED BOUNDED NONPERSISTENT</text></g>
    <g transform="translate(0,464)"><rect width="500" height="100" rx="12" class="guard"/><text x="18" y="31" class="sans name ink">Separate Form and SitZ; evidence-bound history</text><text x="18" y="57" class="sans copy muted">Matthew SitZ is narrow; Transmission failures remain failures.</text><text x="18" y="79" class="mono tag" fill="#245d70">SAFEGUARD + BOUNDED OBSERVATION</text></g>
    <g transform="translate(0,580)"><rect width="500" height="100" rx="12" class="guard"/><text x="18" y="31" class="sans name ink">Decompose Method Hood + addressable handles</text><text x="18" y="57" class="sans copy muted">Internal fields are inspectable; lexical / historical research stays attached.</text><text x="18" y="79" class="mono tag" fill="#245d70">PRESENTATION + PROTOTYPE</text></g>
  </g>
  <path d="M480 260H555M480 376H555M480 492H555M480 608H555M480 724H555M480 840H555" class="arrow"/>
  <path d="M960 260H1035M960 376H1035M960 492H1035M960 608H1035M960 724H1035M960 840H1035" class="arrow"/>
  <rect x="60" y="915" width="1480" height="42" rx="8" fill="#21372d"/>
  <text x="800" y="942" text-anchor="middle" class="serif" font-size="21" fill="#f5f1e8">Dashed arrows mean architecture pressure, not intellectual influence, adoption, or proof.</text>
</svg>

