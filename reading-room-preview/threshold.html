<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>The Gospels — a reading room · Grammar of Meaning</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* The Gospels — the threshold (door). Rebuilt to the Lovable gospel-depths mock's WIDE/EDITORIAL
   layout: the ground IMAGE is the visible full-bleed layer (brightened), a subtle bottom-left scrim
   for legibility, a big LEFT-aligned wordmark. render-from-data (data/gospels_room_config.json).
   Ground images MET Open Access (CC0) or project-owned — NEVER swap/regenerate (IMAGE-CREDITS.md). */
:root{--serif:"Cormorant Garamond",Georgia,serif;--mono:"IBM Plex Mono",ui-monospace,monospace;
  --title:#f2e6d6;--body:#e8dfce;--kicker:#d8c9a8;--rule:#a5843d;--ground:#0b0e11;
  --tshadow:0 1px 2px rgba(0,0,0,.5),0 0 22px rgba(0,0,0,.4),0 0 46px rgba(0,0,0,.2);
  --bshadow:0 1px 2px rgba(0,0,0,.5),0 0 14px rgba(0,0,0,.34),0 0 30px rgba(0,0,0,.16)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--body);font-family:var(--serif);overflow:hidden;transition:background 1.6s ease}
/* two stacked full-bleed ground layers cross-fade between grounds; the IMAGE is visible */
.bg{position:fixed;inset:0;z-index:0;background-size:cover;background-position:50% 55%;
  opacity:0;transition:opacity 1.6s ease;transform:scale(1.05);transform-origin:50% 50%}
.bg.on{opacity:1}
/* the mock's exact editorial scrim — dark bottom-left for legibility, image shows top-right */
.scrim{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:radial-gradient(ellipse 70% 52% at 26% 58%, rgba(0,0,0,.30) 0%, rgba(0,0,0,.12) 52%, rgba(0,0,0,0) 100%),
             linear-gradient(to top, rgba(0,0,0,.46) 0%, rgba(0,0,0,.14) 30%, rgba(0,0,0,0) 55%)}
/* content — full height, LEFT-aligned, justify-between (kicker top / wordmark mid / actions bottom) */
.wrap{position:relative;z-index:2;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
  justify-content:space-between;padding:5vh clamp(24px,6vw,80px) 8vh;text-align:left}
.kicker{font-family:var(--mono);font-size:12px;letter-spacing:.26em;text-transform:uppercase;
  color:var(--kicker);text-shadow:var(--bshadow);margin:0;min-height:1.2em;transition:color 1.6s ease}
.mid{max-width:46rem}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(2.6rem,10vw,9rem);line-height:.92;
  letter-spacing:.005em;color:var(--title);text-shadow:var(--tshadow);margin:0;transition:color 1.6s ease}
.rule{height:1px;width:min(40vw,10rem);background:var(--rule);opacity:.55;margin:min(4vh,2rem) 0;transition:background 1.6s ease}
.tag{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(17px,2.4vw,24px);
  line-height:1.5;color:var(--body);text-shadow:var(--bshadow);max-width:34rem;margin:0;transition:color 1.6s ease}
.foot{display:flex;flex-direction:column;gap:16px}
.actions{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.enter{font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#17110a;
  background:color-mix(in srgb,var(--kicker) 90%,#fff);border:none;border-radius:999px;padding:14px 36px;
  cursor:pointer;transition:transform .2s,background .25s;text-decoration:none;display:inline-block}
.enter:hover{transform:translateY(-1px);background:#f5ead2}
.audio{font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--body);background:rgba(10,8,6,.4);
  border:1px solid rgba(235,225,205,.4);border-radius:999px;padding:12px 16px;cursor:pointer;backdrop-filter:blur(3px)}
.audio[aria-pressed=true]{color:#f0d9a8;border-color:rgba(240,217,168,.65)}
.credit{font-family:var(--mono);font-size:10px;letter-spacing:.02em;color:var(--kicker);text-shadow:var(--bshadow);
  opacity:.85;margin:0;max-width:64ch;line-height:1.6;transition:color 1.6s ease}
.credit a{color:inherit}
.themebtn{position:fixed;top:16px;right:16px;z-index:5;background:rgba(10,8,6,.45);
  border:1px solid rgba(235,225,205,.4);border-radius:999px;padding:6px 14px;
  font:12px var(--mono);letter-spacing:.06em;cursor:pointer;color:var(--body);backdrop-filter:blur(3px)}
/* quiet ground stepper — bottom-right, like the mock */
.stepper{position:fixed;bottom:22px;right:22px;z-index:5;display:flex;align-items:center;gap:10px;
  font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:rgba(245,240,228,.55);opacity:.5;transition:opacity .25s}
.stepper:hover{opacity:1}
.stepper button{width:32px;height:32px;display:grid;place-items:center;border-radius:999px;cursor:pointer;
  border:1px solid rgba(245,240,228,.28);background:rgba(10,8,6,.35);color:rgba(245,240,228,.85);backdrop-filter:blur(3px);font-size:13px}
.stepper button:hover{background:rgba(255,255,255,.12)}
@media(prefers-reduced-motion:reduce){.bg,.scrim,.kicker,h1,.tag,.rule,.credit,body{transition:none}.bg{transform:none}}
@media(max-width:640px){.wrap{padding-top:8vh}.credit{font-size:9px}.rule{margin:3vh 0}}
</style>
<script>(function(){try{var t=localStorage.getItem("gom-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}})();
function gomTheme(){var r=document.documentElement;var t=r.dataset.theme==="dark"?"light":"dark";r.dataset.theme=t;try{localStorage.setItem("gom-theme",t);}catch(e){}}</script>
</head>
<body>
<div class="bg" id="bgA" aria-hidden="true"></div>
<div class="bg" id="bgB" aria-hidden="true"></div>
<div class="scrim" aria-hidden="true"></div>
<button class="themebtn" onclick="gomTheme()">theme</button>

<main class="wrap">
  <p class="kicker" id="kicker"></p>
  <div class="mid">
    <h1>The Gospels</h1>
    <div class="rule"></div>
    <p class="tag" id="tag">Six movements. Four witnesses. One life, told four times over — read slowly, in the old manner.</p>
  </div>
  <div class="foot">
    <div class="actions">
      <a class="enter" id="enterBtn" href="all.html">Enter</a>
      <button class="audio" id="audioBtn" aria-pressed="false" title="Ambient plainsong — off by default, plays softly">&#9835; <span id="audioLabel">play evensong</span></button>
      <audio id="evensong" preload="none"></audio>
    </div>
    <p class="credit" id="credit"></p>
  </div>
</main>

<div class="stepper" aria-hidden="true">
  <button id="prevG" title="Previous ground">&#8249;</button>
  <span id="gCount"></span>
  <button id="nextG" title="Next ground">&#8250;</button>
</div>

<script>
(function(){
  var reduce = matchMedia('(prefers-reduced-motion:reduce)').matches;
  var bgA=document.getElementById('bgA'), bgB=document.getElementById('bgB'),
      kicker=document.getElementById('kicker'), tag=document.getElementById('tag'), credit=document.getElementById('credit'),
      gCount=document.getElementById('gCount'), root=document.documentElement.style, front=bgA, back=bgB;
  var GROUNDS=[], ENTRY=null, i=0, timer=null;
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  function paint(g){
    back.style.backgroundImage = "url('"+g.img+"')";
    back.style.backgroundPosition = g.focus || '50% 55%';
    back.style.filter = g.imgFilter || 'none';
    back.classList.add('on'); front.classList.remove('on');
    var t=front; front=back; back=t;                       // swap
    root.setProperty('--ground', g.ground_color || '#0b0e11');
    root.setProperty('--kicker', g.kicker || '#d8c9a8');
    root.setProperty('--title', g.title_color || '#f2e6d6');
    root.setProperty('--body', g.body_color || '#e8dfce');
    root.setProperty('--rule', g.rule || '#a5843d');
    kicker.textContent = (g.label||'').toUpperCase();
    var tail = g.met_url ? '<a href="'+g.met_url+'" target="_blank" rel="noopener">'+esc(g.credit_tail||'')+'</a>' : esc(g.credit_tail||'');
    credit.innerHTML = esc(g.note||'') + (g.note&&tail?' &middot; ':'') + tail;
    gCount.textContent = (i+1)+' / '+GROUNDS.length;
  }
  function go(n){ i=(n+GROUNDS.length)%GROUNDS.length; paint(GROUNDS[i]); }
  function next(){ go(i+1); } function prev(){ go(i-1); }
  function restart(){ if(timer)clearInterval(timer); if(ENTRY && ENTRY.rotate!==false && !reduce && GROUNDS.length>1) timer=setInterval(next,14000); }

  fetch('data/gospels_room_config.json').then(function(r){return r.json();}).then(function(c){
    GROUNDS=(c.grounds||[]).filter(function(g){return g.img;}); ENTRY=c.entry||{};
    if(ENTRY.tagline) tag.textContent=ENTRY.tagline;
    if(!GROUNDS.length) return;
    var di=GROUNDS.findIndex(function(g){return g.id===(ENTRY.default_ground||'stone');}); i=di>=0?di:0;
    GROUNDS.forEach(function(g){ var im=new Image(); im.src=g.img; });   // preload for smooth fades
    paint(GROUNDS[i]); restart();
    document.getElementById('nextG').addEventListener('click',function(){next();restart();});
    document.getElementById('prevG').addEventListener('click',function(){prev();restart();});
    document.addEventListener('keydown',function(e){ if(e.key==='ArrowRight'){next();restart();} if(e.key==='ArrowLeft'){prev();restart();} });
    document.addEventListener('visibilitychange',function(){ if(document.hidden){if(timer)clearInterval(timer);} else restart(); });
  }).catch(function(){ kicker.textContent=''; });

  // ── evensong — off by default; the 3 plainsong tracks rotate ──
  var ab=document.getElementById('audioBtn'), au=document.getElementById('evensong'), al=document.getElementById('audioLabel');
  var TRACKS=[
   {t:'Palestrina, Sicut lilium inter spinas — The Tudor Consort',src:'assets/palestrina-sicut-lilium.mp3'},
   {t:'Palestrina, Agnus Dei (Missa Sicut lilium) — The Tudor Consort',src:'assets/palestrina-agnus-dei.mp3'},
   {t:'Gregorian, Audi Benigne Conditor — Gregoriana',src:'assets/gregorian-audi-benigne.mp3'}
  ];
  var cur=0; au.volume=0.32; au.src=TRACKS[0].src;
  function playTrack(n){ cur=n; au.src=TRACKS[n].src;
    au.play().then(function(){ ab.setAttribute('aria-pressed','true'); al.textContent='pause evensong'; })
             .catch(function(){ al.textContent='evensong unavailable'; }); }
  ab.addEventListener('click', function(){
    if(ab.getAttribute('aria-pressed')==='true'){ au.pause(); ab.setAttribute('aria-pressed','false'); al.textContent='play evensong'; }
    else { playTrack(cur); } });
  au.addEventListener('ended', function(){ playTrack((cur+1)%TRACKS.length); });
})();
</script>
</body>
</html>
