      +mine.map(function(m){return verseTree(m,v.verse_id,0,KIDS,BY);}).join('')
    +'</div>';
  }).join('');
  /* the component discloses itself in place -- "see how" opens the anatomy under the paraphrase,
     which is the Move Score's gesture. Clicking a move selects it too, so the margins and the arc
     stay aligned with what is being read. */
  [].forEach.call(document.querySelectorAll('.mv > .para'),function(pa){
    pa.onclick=function(e){ e.stopPropagation();
      var mv=pa.parentElement, wasOpen=mv.classList.contains('open');
      keepingPlace(function(){
        /* .sel is theirs too: the move being read takes the gold rule. I had only been toggling
           .open, so an opened move kept the neutral hairline and never showed which one was live. */
        [].forEach.call(document.querySelectorAll('.mv.sel'),function(x){x.classList.remove('sel');});
        mv.classList.toggle('open', !wasOpen);
        mv.classList.toggle('sel', !wasOpen);
        /* their rule is `.anat.open`, so the ANAT carries the state, not the .mv. Toggling only the
           .mv left the anatomy display:none -- "see how" expanded nothing at all, and I did not
           catch it because I was checking textContent and class names instead of visibility. */
        var an=mv.querySelector('.anat'); if(an) an.classList.toggle('open', !wasOpen);
        pa.querySelector('.exp').innerHTML = wasOpen ? 'see how \u203a' : 'hide \u2039';
      }, S.verse);
      selectMove(mv.getAttribute('data-mv'));
      scheduleAlign();
    };
  });
  [].forEach.call(document.querySelectorAll('[data-conn]'),function(a){
    a.onclick=function(e){e.preventDefault();e.stopPropagation();
      selectMove(a.getAttribute('data-conn')); showLens('connect');};
  });
  [].forEach.call(document.querySelectorAll('.verse'),function(el){
    el.onclick=function(){selectVerse(el.getAttribute('data-verse'));};
    el.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();selectVerse(el.getAttribute('data-verse'));}};
  });
}

/* ══ SELECT ONCE -> ALIGN EVERYWHERE ══ */
/* Selecting a verse MARKS it — it lights the line, aligns the margins, and nothing else. It used to
   force S.lens='see' and open the drawer, which meant a click on READ swung open a panel the step
   had not earned, directly contradicting the step's own sentence ("nothing else is on screen yet").
   A gate that any click can walk through is not a gate. A reader opens a lens by choosing a lens. */
function selectVerse(vid){
  var same=(S.verse===vid);
  S.verse=vid; S.move=null;
  var ms=movesForVerse(vid); if(ms.length) S.move=ms[0].move_handle;
  keepingPlace(function(){
    paintText();
    /* Clicking the VERSE unfolds its moves. The anatomy used to open only from the small "see how"
       on the move itself, or by jumping from the bar at the top -- so the obvious gesture, clicking
       the line you are reading, did nothing visible. Clicking again folds it back, which is the
       same affordance in reverse rather than a second one to learn. */
    var mvs=movesFor(vid), anyOpen=mvs.some(function(el){return el.classList.contains('open');});
    mvs.forEach(function(el){
      var want = same ? !anyOpen : true;
      el.classList.toggle('open', want);
      el.classList.toggle('sel', want);
      var an2=el.querySelector('.anat'); if(an2) an2.classList.toggle('open', want);
      var x=el.querySelector('.exp'); if(x) x.innerHTML = want ? 'hide \u2039' : 'see how \u203a';
    });
    if(document.body.classList.contains('open')) paintAside();
  }, vid);
  scheduleAlign();
}
function movesFor(vid){
  var host=document.querySelector('.verse[data-verse="'+vid+'"]'), out=[];
  for(var n=host&&host.nextElementSibling; n && !n.classList.contains('verse'); n=n.nextElementSibling){
    if(n.classList.contains('mv')) out.push(n);
    [].push.apply(out, [].slice.call(n.querySelectorAll('.mv')));
  }
  return out;
}
/* MARKING a move is not OPENING a panel about it. The move's own anatomy is on the page, under its
   paraphrase, so selecting one only needs to align the margins and the arc with what is being read.
   The old selectMove() called open(), which is why clicking a move made it "pop to the right" -- the
   reader was shown a drawer containing the thing they had just clicked on. openMove() is kept for
   the places that genuinely want the drawer (the arc's jump-to, a cross-reference from Connect). */
function selectMove(h){ var m=moveByHandle(h); if(!m)return;
  S.move=h; if(m.verse_ids.length) S.verse=m.verse_ids[0];
  keepingPlace(function(){ paintText(); if(document.body.classList.contains('open')) paintAside(); }, S.verse);
  writeURL(); }
function openMove(h){ selectMove(h); if(!S.lens) S.lens='evidence'; open(); }
function showLens(id){ S.lens=id; open(); }
/* Wide layout: the rail and the panel are absolutely placed, so opening one costs no layout.
   Narrow layout: the rail joins the flow and would push the text down by its own height. Both cases
   are covered by compensating around the whole mutation rather than around any one part of it. */
function open(){ keepingPlace(function(){
  document.body.classList.add('open'); paintText(); paintRail(); paintAside(); }, S.verse); }

/* ══ CLOSE -> ORDINARY READING, SAME PLACE.  Only classes + a transform change, so the
      document never reflows and the scroll offset is untouched. ══ */
function closeAll(){
  keepingPlace(function(){
    S.verse=null; S.move=null; S.lens=null;
    document.body.classList.remove('open');
    paintText();
    document.getElementById('rail').innerHTML='';
    document.getElementById('aside').innerHTML='';
  });
}
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeAll(); });

/* ══ THE RAIL — every lens says, for THIS selection, whether it can answer ══ */
function lensState(id){
  var ms=activeMoves();
  if(id==='see')      return ms.length?{s:'ok'}:{s:'none-here'};
  if(id==='world')    return ms.length?{s:'ok'}:{s:'none-here'};
  if(id==='inherits'){var n=ms.reduce(function(a,m){return a+(m.lineage||[]).length;},0);
                      return n?{s:'ok',mk:n}:{s:'none-here'};}
  if(id==='connect'){ var n=edgesFor(ms).length; return n?{s:'ok',mk:n}:{s:'none-here'};}
  if(id==='compare')  return (S.verse&&D.witnesses.by_verse[S.verse])?{s:'ok',mk:D.witnesses.lanes.length}:{s:'no-join'};
  if(id==='reached')  return (D.witness_chain&&D.witness_chain.this_text)?{s:'text-level'}:{s:'none-here'};
  if(id==='afterlives')return (S.verse===D.reception.anchored_verse_id)?{s:'ok',mk:D.reception.readers.length}:{s:'out-of-scope'};
  if(id==='open')     return {s:'awaiting-method'};
  if(id==='evidence') return {s:'ok'};
  return {s:'ok'};
}
/* A step offers only the lenses it has EARNED. This is the ladder's one real constraint, and it is
   the reason the sequence is a method rather than a suggestion: showing RESPOND's readings while the
   reader is still on READ would hand them someone else's question before they have their own.
   EVIDENCE is exempt -- where a thing came from is never a spoiler, and a reader who distrusts the
   page must be able to check it at any point. */
function lensesForStep(){
  var earned={}, i=stepIndex();
  STEPS.slice(0, i+1).forEach(function(x){
    if(x.lens) earned[x.lens]=1;
    (x.unlocks||[]).forEach(function(k){ earned[k]=1; });
  });
  /* EVIDENCE from UNPACK on, not from READ. "Where is this from?" needs a claim to point at, and at
     READ there is not one yet -- the only provenance in play is the text's own, and the header
     already carries it (edition + rights, in view the whole time). Offering the lens at READ asked a
     question the step has not raised, which is what made the rail feel like it belonged to a
     different page. From UNPACK there is a reading on screen, and the question becomes real. */
  if(i>0) earned['evidence']=1;
  return LENSES.filter(function(L){ return earned[L.id]; });
}

/* ONE MENU, and it is the ladder. The lens rail used to float in the left margin -- which is Sitz's
   column, so the two overlapped -- and at READ it offered "ask of it: EVIDENCE, where is this from?",
   which is not the question READ asks. Two navigations in two places, neither explaining the other.
   The lenses that are not steps now sit as a quiet row beneath the ladder: same place, same moment,
   subordinate to the step. */
function paintRail(){
  var ls=lensesForStep();
  document.getElementById('rail').innerHTML=ls.length?('<div class="rail-in">'+
   ls.map(function(L){
     var st=lensState(L.id);
     var tip=st.s==='ok'?'':STATES[st.s];   /* the rail says WHY a lens is quiet, not merely that it is */
     return '<button class="lens'+(S.lens===L.id?' on':'')+'" data-lens="'+L.id+'" data-state="'+(st.s==='ok'?'':st.s)+'"'
      +(tip?' title="'+esc(tip)+'"':'')+'>'
      +'<span class="q">'+L.q+(st.mk?'<span class="mk">'+st.mk+'</span>':'')+'</span></button>';
   }).join('')+'</div>'):'';
  [].forEach.call(document.querySelectorAll('.lens'),function(b){
    b.onclick=function(){showLens(b.getAttribute('data-lens'));};
  });
}

function edgesFor(ms){
  var set={}; ms.forEach(function(m){set[m.move_handle]=1;});
  return D.connect.edges.filter(function(e){
    return e.from.some(function(x){return set[x];}) || e.to.some(function(x){return set[x];});
  });
}

/* ══ THE OPEN LENS ══ */
function paintAside(){
  var L=LENSES.filter(function(x){return x.id===S.lens;})[0]; if(!L) return;
  var v=verseById(S.verse), m=S.move?moveByHandle(S.move):null;
  var head='<div class="a-top"><span class="a-q">'+L.q+'</span>'
    +'<button class="a-x" id="ax" title="close (Esc)">✕</button></div>'
    +'<p class="a-sub">'+esc(L.n)+(v?' · '+esc(v.ref):'')+(m?' · '+esc(m.label):'')+'</p>';
  var body=({see:lensSee,connect:lensConnect,world:lensWorld,inherits:lensInherits,
             compare:lensCompare,reached:lensReached,afterlives:lensAfterlives,
             open:lensOpen,evidence:lensEvidence}[S.lens])(v,m);
  document.getElementById('aside').innerHTML='<div class="aside-in">'+head+body+'</div>';
  var x=document.getElementById('ax'); if(x) x.onclick=closeAll;

/* SEE — the move grammar (Method fact, plane A; rendered, never re-derived) */
/* ONE definition of the move's grammar, used by the inline move under the verse AND by the SEE
   drawer — extracted rather than copied, because two copies of a rendering is how the labeled line
   and the diagram diverged in the first place. */
/* The reproducibility caveat rides WITH the move, not only in EVIDENCE. A reader who opens one move
   and reads its agent, operation and outcome is making exactly the per-point inference the finding
   says the data cannot support -- and they will not go three clicks to EVIDENCE to learn that. It
   renders from the adapter's cited facts, so it disappears on its own when the citation expires. */
function reproNote(){
  var c=((D._adapter||{}).cited||[]).filter(function(x){return /would not reproduce/.test(x.fact);})[0];
  if(!c) return '';
  return '<p class="repro">This reading would not reproduce. '
    +'<span class="dim">The coder held one conversation across passages, so this move was read in the '
    +'presence of the ones before it. The shape of the whole passage is expected to survive that; a '
    +'single move\u2019s reading is not.</span></p>';
}

function grammar(m){
  /* plain word leads, the coded field follows in parens (Fidelity: the term is present, not replaced) */
  var rl=[];
  if(m.agent)     rl.push('<span><b class="rl">who <span class="rterm">(agent)</span></b>'+esc(m.agent)+'</span>');
                  rl.push('<span><b class="rl">does <span class="rterm">(operation)</span></b>'+esc(m.operation||m.move_type||'')+'</span>');
  if(m.substrate) rl.push('<span><b class="rl">on <span class="rterm">(substrate)</span></b>'+esc(m.substrate)+'</span>');
  if(m.outcome)   rl.push('<span><b class="rl">result <span class="rterm">(outcome)</span></b>'+esc(m.outcome)+'</span>');
  var dia='<div class="gram" style="margin:0"><div class="g-row">'
      +'<div class="g-box"><span class="g-t">who</span><span class="g-v">'+esc(m.agent||'—')+'</span></div>'
      +'<div class="g-op"><span class="arw">→</span><span class="opn">'+esc(m.operation||'')+'</span><span class="arw">→</span></div>'
      +'<div class="g-box"><span class="g-t">what results</span><span class="g-v">'+esc(m.outcome||'—')+'</span></div>'
    +'</div>'
    +(m.substrate?'<div class="g-box" style="margin-top:.32rem"><span class="g-t">upon</span><span class="g-v">'+esc(m.substrate)+'</span></div>':'')
    +'</div>';
  return '<div class="gram">'
    +'<div class="roleline">'+rl.join('')+'</div>'
    +'<button class="asdiagram" data-dia="1" aria-expanded="false">show as diagram</button>'
    +'<div class="dia-wrap" hidden>'+dia+'</div>'
    +'<p class="g-meta">'+esc(m.voice||'')+' · '+esc(m.move_type||'')
      +(m.nested_under?' · nested under '+esc(m.nested_under):'')+'<br>told by '+esc(m.narrator||'—')+'</p></div>';
}

function lensSee(v,m){
  if(!m) return state('none-here','No move is coded on this verse.',
    'the coded set is '+D.moves.items.length+' moves across '+D.text.ref+':'+D.text.verses[0].n+'\u2013'+D.text.verses[D.text.verses.length-1].n);
  var af=D.account_frame.values||{}, veer=0, rawN=0;
  var ribbon=Object.keys(af).sort().map(function(a){
    var fp=(m.frame_permove||{})[a], isV=(fp!=null&&fp!==af[a]); if(isV)veer++;
    var raw=(fp!=null && !isGlossed(a,fp));
    if(raw) rawN++;
    var aGloss=isGlossed(a,'')?axLabel(a):'';                    /* the axis's own reader phrase, if written */
    var vGloss=raw?'':valLabel(a,fp);                            /* the value's, if written */
    var vTerm=(fp==null)?'—':hum(fp);                            /* the method's word, always shown */
    return '<div class="ax'+(isV?' veer':'')+'">'
      +'<span class="an"><b class="term">'+esc(a)+'</b>'
        +(aGloss?'<span class="gl">'+esc(aGloss)+'</span>':'')+'</span>'
      +'<span class="av"><b class="term">'+esc(vTerm)+'</b>'
        +(vGloss?'<span class="gl">'+esc(vGloss)+'</span>':'')
        +(isV?'<span class="base">'+esc(hum(af[a]))+'</span>':'')+'</span></div>';
  }).join('');
  var d='';
  if(m.frame_delta_axis&&m.frame_delta_from!=null&&m.frame_delta_to!=null){
    var ax=m.frame_delta_axis;
    d='<p class="h">what shifted from the move before</p><p class="p">'
      +'<b>'+esc(ax)+'</b>'+(isGlossed(ax,'')?' <span class="dim">'+esc(axLabel(ax))+'</span>':'')+'<br>'
      +esc(hum(m.frame_delta_from))+' <span class="sh">\u2192</span> <b>'+esc(hum(m.frame_delta_to))+'</b></p>';
  }
  return grammar(m)
    +(m.paraphrase?'<p class="h">the move, restated</p><p class="gloss">'+esc(m.paraphrase)+'</p>'
        +'<p class="a-anchor" style="margin-top:-.15rem">Hold this against the verse above: it is what the coder took the move to be, worded so you can disagree.</p>':'')
    +(m.gloss?'<p class="h">what it is doing, read closely</p><p class="gloss">'+esc(m.gloss)+'</p>'
        +'<p class="a-anchor" style="margin-top:-.15rem">A reading, not a restatement \u2014 this one interprets.</p>':'')
    +'<p class="h">the frame — '+(veer?veer+' of 8 axes veer from this account':'holds the account baseline')+'</p>'+ribbon+d
    /* today this is 8 of 8 on every move — value_gloss says so itself: 8 filled, 279 pending, and all 8
       filled entries are the axis NAMES. Worded so the all-raw case reads as a state of the work rather
       than as a broken panel, and so it updates itself as Content SB fills entries in. */
    +(rawN? '<p class="a-anchor">'+(rawN===8
        ? 'Each axis is named in the method\u2019s own word, with the plain meaning beneath it. The values have no plain wording written for them yet, so they appear as the method\u2019s word alone.'
        : rawN+' of these 8 values have no plain wording written for them yet, so they appear as the method\u2019s word alone.')+'</p>' : '')
    +anchorNote('Tied to this verse by the verse numbers the coder recorded. Every field above comes from the coded export \u2014 nothing on this panel was inferred here \u2014 but the two sentences are different kinds: one restates the move, one interprets it, and they are labelled apart.');
}

/* CONNECT — the typed edges (no edge_id upstream, so an edge is shown, not selectable) */
function lensConnect(v,m){

      D.connect.count+' links are recorded across the text');

    var mine=ms.some(function(x){return e.from.indexOf(x.move_handle)>=0;});
    var other=(mine?e.to_labels:e.from_labels).join(' + ');

}

function lensCompare(v,m){

    'The four gospels are compared as <b>'+cg.beats.length+' narrative beats</b>, not verse by verse — so no beat can be lined up against '+esc(v?v.ref:'this verse')+' yet.',
    cg.seam_reader||'');

       +D.witnesses.verses_where_all_witnesses_agree+' of '+D.witnesses.verses_total+'. '
       +'The comparison across the four gospels is not recorded that way at all — see above.');

/* REACHED US — witness / transmission. The one lens whose danger is entirely in how it is drawn.
   IRR231 is unanimous that these degrees are a reconstruction MODEL, not a measurement, and the feed's own
   design brief says the reconstruction-vs-explicit-in-source asymmetry must be unavoidable. So: the number
   never leads, it never appears without the word "reconstruction" beside it, and what it rests on is shown
   next to it. A degree drawn as a clean integer beside a claim reads as a count of real hops — which is
   exactly the vote-count-becomes-truth failure the Panel refuses, one output over. */
function lensReached(v,m){
  var W=D.witness_chain, me=W&&W.this_text;
  if(!me) return state('none-here','No transmission reconstruction is recorded for this text.','');
  var lo=me.degree_range[0], hi=me.degree_range[1];
  var span=(lo===hi)?String(lo):(lo+'–'+hi);
  var tops=Object.keys(me.per_topology||{});
  return '<p class="h">how far this text stands from what it reports</p>'
    +'<div class="st st-text-level"><span class="stl">a reconstruction, not a count</span>'
    +'<b>'+esc(span)+' removes</b> under '+tops.length+' different scholarly pictures of who copied whom'
    +(me.degree_stable?' — and the same under each of them.':' — and it differs between them.')
    +'<span class="why">'+esc(W.reader_caveat)+'</span></div>'
    +'<p class="h">what that rests on</p>'
    +'<p class="p">'+esc(me.load_bearing_edge||'—')+'<br><span class="dim">remove that one link and the '
    +'estimate moves — it is the load-bearing step, not one among equals.</span></p>'
    +(me.tradition_antiquity?'<p class="h">how early the tradition is</p><p class="p">'
      +esc(me.tradition_antiquity.est||'')+(me.tradition_antiquity.note?'<br><span class="dim">'
      +esc(me.tradition_antiquity.note)+'</span>':'')+'</p>':'')
    +'<p class="h">the other witnesses, on the same reconstruction</p>'
    +W.others.map(function(o){
       var r=(o.degree_range[0]===o.degree_range[1])?String(o.degree_range[0])
             :(o.degree_range[0]+'–'+o.degree_range[1]);
       return '<div class="row"><span class="rt">'+esc(o.key.replace(/-/g,' '))+'</span>'
         +'<span class="rm">'+esc(r)+' removes · '+esc(String(o.evidence_status).replace(/-/g,' '))+'</span></div>';
     }).join('')
    +'<p class="h">where it is contested</p>'
    +'<p class="p">'+esc(W.contested||'—')+'</p>'
    +state('awaiting-method','That these texts hold the same order under different scholarly pictures is '
      +'agreement among scholars — not proof of how the texts actually descended.',
      W.circularity_note)
    +anchorNote('This describes the whole of Mark, not the verse you selected — it is one estimate for the '
      +'text as a text. Every figure here is a modern reconstruction; where a tradition records its own '
      +'chain of transmitters instead, that is a different kind of claim and is never merged with these.');
}

/* ── status pill: derived from the Design State Registry, never hand-typed (rule 8) ── */
function derive(s){
  if(!s) return {label:'—',cls:'na'};
  var d=s.deployment,i=s.implementation,o;
  if(d==='live'&&i==='built') o={label:'live',cls:'live'};
  else if(d==='live'&&(i==='partial'||s.maturity==='pilot')) o={label:'pilot',cls:'pilot'};
  else if(d==='staging') o={label:'preview',cls:'pilot'};
  else if(d==='offline'&&i==='partial') o={label:'paused',cls:'paused'};
  else if(d==='offline'&&i==='unbuilt') o={label:'planned',cls:'soon'};
  else o={label:(i||'—'),cls:'na'};
  if(s.dependency==='blocked') o.label+=' · blocked';
  return o;
}
