<body>

<header class="top">
  <h1>Mark 16</h1>
  <span class="ed" id="ed">·</span>
  <span class="sp"></span>
  <span class="pill na" id="status" data-surface="room.html">—</span>
  <button class="tbtn" id="theme" aria-label="switch light or dark">◐</button>
</header>

<div class="ladder" id="ladder"></div>
<nav class="rail" id="rail" aria-label="other ways to ask"></nav>
<div class="arcwrap" id="arc"></div>
<div class="daf">
  <aside class="marg marg-l" id="margL" aria-label="the world this text is in"></aside>
  <main class="stage" id="stage">
  <p class="invite" id="invite">Begin by reading. Select any verse to see what it is doing.</p>
  <div class="text" id="text"><p class="err">loading Mark 16…</p></div>
  </main>
  <aside class="marg marg-r" id="margR" aria-label="what readers made of it"></aside>
</div>
<aside class="aside" id="aside" aria-live="polite"></aside>
</main>

<footer class="foot" id="foot"></footer>

<script>
/* ══════════════════════════════════════════════════════════════════════════════════
   Everything below RENDERS a feed.  It classifies nothing, scores nothing, and
   adjudicates nothing (SSOT_contributor_rules v2, rule 1 / the four epistemic planes).
   Plane C — Design editorial — is exactly: the reader questions, the section names,
   the pacing, and the wording of the typed states.  Those are marked EDITORIAL below.
   ══════════════════════════════════════════════════════════════════════════════════ */
var D=null, S={verse:null, move:null, lens:null, step:'read'};

function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function hum(v){return String(v==null?'':v).replace(/[-_]/g,' ');}
function axLabel(a){var m=D&&D.reader_words;return (m&&m[a+'|'])||hum(a);}          /* reader words, from the feed */
function valLabel(a,v){if(v==null)return '—';var m=D&&D.reader_words;return (m&&m[a+'|'+v])||hum(v);}
/* Has the method actually written a reader phrase for this value, or are we just de-tokenizing the raw
   code-name? The fallback contract (de-tokenize only, never invent sense) is right — but it renders a miss
   and a hit identically, so a page can look fully translated while most of it is only hyphen-stripped.
   Corpus-wide that is roughly two thirds of all frame reads. Marked, quietly, rather than smoothed. */
function isGlossed(a,v){var m=D&&D.reader_words;return !!(m&&m[a+'|'+v]);}

/* ── EDITORIAL (plane C): the public IA is reader QUESTIONS, never engine names ── */
var LENSES=[
/* There is no SEE lens. "What is it doing?" is answered by the move under the verse, in the centre
   of the page — that is what UNPACK reveals. A drawer that repeats it was a third copy of the same
   content, and it is what kept "popping to the right". */
 {id:'connect',   q:'CONNECT',   n:'what does it link to?'},
 {id:'world',     q:'WORLD',     n:'what world is this?'},
 {id:'inherits',  q:'INHERITS',  n:'what does it draw on?'},
 {id:'compare',   q:'COMPARE',   n:'how do witnesses differ?'},
 {id:'reached',    q:'REACHED US', n:'how did it get here?'},
 {id:'afterlives',q:'AFTERLIVES',n:'what did readers do?'},
 {id:'open',      q:'OPEN',      n:"what's unresolved?"},
 {id:'evidence',  q:'EVIDENCE',  n:'where is this from?'}
];

/* ── the six TYPED states.  A blank is never just a blank: it says which KIND of
      blank it is and why, so an absence is informative rather than a dead end.
      (The anchor-layer analogue of "type the absence before you aestheticize it".) ── */
var STATES={
 'none-here':      'nothing here — and that is a finding',
 'no-join':        'cannot align to your selection yet',
 'awaiting-method':'awaiting the method',
 'out-of-scope':   'coded elsewhere in this text',
 'text-level':     'true of the whole text, not this verse',
 'defect':         'a declared defect in the feed'
};
function state(kind,body,why){
  return '<div class="st st-'+kind+'"><span class="stl">'+esc(STATES[kind])+'</span>'+body
       + (why?'<span class="why">'+esc(why)+'</span>':'')+'</div>';
}

/* ── selection helpers ──────────────────────────────────────────────────────────── */
function movesForVerse(vid){return D.moves.items.filter(function(m){return m.verse_ids.indexOf(vid)>=0;});}
function moveByHandle(h){return D.moves.items.filter(function(m){return m.move_handle===h;})[0]||null;}
function activeMoves(){ if(S.move){var m=moveByHandle(S.move);return m?[m]:[];} return S.verse?movesForVerse(S.verse):[]; }
function verseById(v){return D.text.verses.filter(function(x){return x.verse_id===v;})[0]||null;}

/* ══ THE TEXT — the persistent centre.  Rebuilt only on selection change, and only
      its CLASSES change, so no line ever re-breaks and no scroll position is lost. ══ */
/* Adding or removing the move-chip row changes document height ABOVE the reader when the previous
   selection was higher up the page — which would slide the text under them. So every mutation of the
   text column is wrapped: anchor on the topmost verse still in view, then give back exactly the
   offset the mutation took. Class changes alone are free; this is only for the chips. */
function keepingPlace(mutate, preferId){
  /* Anchor on what the reader is actually looking at: the verse they just acted on if there is one,
     otherwise the topmost verse still in view. Chips land UNDER the selected verse, so anchoring there
     is also what makes "the thing I clicked doesn't jump" true — content below it moving down is
     correct, and is where the new material went. */
  var anchor=preferId?document.querySelector('.v[data-verse="'+preferId+'"]'):null;
  if(!anchor)[].some.call(document.querySelectorAll('.v'),function(el){
    if(el.getBoundingClientRect().bottom>0){anchor=el;return true;} return false;});
  var before=anchor?anchor.getBoundingClientRect().top:0;
  mutate();
  if(!anchor) return;
  var delta=anchor.getBoundingClientRect().top-before;
  if(Math.abs(delta)>0.5) window.scrollBy(0,delta);
}

/* ══ THE LADDER — the reading method, as steps ═══════════════════════════════════════════════
   PI, S181: "we are proposing a meaning-making method with this, that has steps, and each one is
   asking something different of the reader... you can engage with a gloss AFTER you've read it,
   digested what it's saying, understood the context, then you can start seeing gaps, and then
   responses to them."

   THE ORDER IS FORCED, not a preference, and that is the whole argument for making it a sequence
   instead of a page of panels:
     - a GAP is only visible against an expectation. Expectation is what READ, UNPACK and SITUATE
       build. Show the absences first and they are just holes; show them fourth and they are
       findings. (Which is this project's own claim about negative space, made operational on a
       reader rather than asserted at them.)
     - a RESPONSE -- a gloss, a later reader, a whole added ending -- is an answer TO a gap. Put it
       before the gap and the reader inherits someone else's question instead of arriving at their
       own.
   So each step is a precondition for the next, and the room can honestly refuse to skip.

   Cumulative by design: step N shows layers 1..N. "Add each layer and see how that changes your
   understanding" needs the earlier layers still on screen to change.

   This SUPERSEDES the persistent-margins layout I recommended, and restores §G's binding clause
   ("surrounding lenses -- not all open at once"), which the ladder turns out to be the reason for. */
var STEPS=[
  {id:'read',    n:'READ',    ask:'What does it say?',
   note:'The text alone, in the edition it was checked out from. Nothing else is on screen yet.'},
  {id:'unpack',  n:'UNPACK',  ask:'What is it doing?',
   note:'Each move restated so you can hold it against the verse and disagree \u2014 in the text itself, not in a panel beside it.',
   unlocks:['connect','inherits','compare','reached']},
  {id:'situate', n:'SITUATE', ask:'What world is it in?',
   note:'The conditions the text was made in. Watch what changes now that you have your own reading to change.', lens:'world'},
  {id:'gaps',    n:'GAPS',    ask:'What is not here?',
   note:'What the text does not say, and where it stops. You can only see this now \u2014 an absence needs an expectation to be an absence.', lens:'open'},
  {id:'respond', n:'RESPOND', ask:'What did readers do with it?',
   note:'Readings, later hands, whole added endings \u2014 answers to the gaps you just saw.', lens:'afterlives'}
];
/* ── THE MARGINS ───────────────────────────────────────────────────────────────────────────────
   Marginalia, not sidebars: many small things each anchored to the line they read, rather than one
   panel that swaps. LEFT is Sitz -- the world the text is in. RIGHT is what readers made of it.
   Both render from the feed; a margin with nothing in it says so rather than going blank. */
/* ── THE MOVE COMPONENT (lifted from viz_move_score_v2.html) ─────────────────────────────────── */
var ROLE={active:{w:'Acts',g:'the agent performs the action'},
          passive:{w:'Undergoes',g:'the action happens to the agent'},
          middle:{w:'Acts on itself',g:'agent and affected are the same'},
          reported:{w:'Is reported',g:'told at second hand'}};
function roleOf(v){return ROLE[v]||{w:hum(v||'—'),g:''};}

function moveHTML(m,isChild){
  return '<div class="mv'+(isChild?' child':'')+'" data-mv="'+esc(m.move_handle)+'">'
    +'<div class="para"><span class="mk">'+esc(m.label)+'</span>'
      +'<span class="pp">'+esc(m.paraphrase||m.operation||'')+'</span>'
      +'<span class="exp">see how \u203a</span></div>'
    +'<div class="anat">'+roleline(m)+axesHTML(m)+connLine(m)+'</div>'
  +'</div>';
}
function roleline(m){
  var p=[];
  if(m.agent)     p.push('<span><b class="rl">who <span class="rterm">(agent)</span></b>'+esc(m.agent)+'</span>');
                  p.push('<span><b class="rl">does <span class="rterm">(operation)</span></b>'+esc(m.operation||m.move_type||'')+'</span>');
  if(m.substrate) p.push('<span><b class="rl">on <span class="rterm">(substrate)</span></b>'+esc(m.substrate)+'</span>');
  if(m.outcome)   p.push('<span><b class="rl">result <span class="rterm">(outcome)</span></b>'+esc(m.outcome)+'</span>');
  return '<div class="roleline">'+p.join('')+'</div>';
}
function axesHTML(m){
  var role=roleOf(m.voice);
  return '<dl class="axes">'
    +'<dt>kind of move</dt><dd>'+esc(hum(m.move_type)||'—')+'</dd>'
    +'<dt>agent\u2019s role</dt><dd>'+esc(role.w)+' <span class="code">('+esc(m.voice||'')+')</span>'
      +(role.g?' \u00b7 <span class="narr">'+esc(role.g)+'</span>':'')+'</dd>'
    +'<dt>place</dt><dd>'+(m.nested_under?('inside '+esc(m.nested_under)+' <span class="code">(nested)</span>')
                                         :'main move <span class="code">(top-level)</span>')+'</dd>'
    +(m.narrator?'<dt>narrator</dt><dd class="narr">'+esc(m.narrator)+'</dd>':'')
  +'</dl>';
}
function connLine(m){
  var n=((D.connect||{}).edges||[]).filter(function(e){
    return e.from===m.label||e.to===m.label||e.source_move===m.label||e.target_move===m.label;}).length;
  if(!n) return '';
  return '<div class="conn"><span class="rl">connections</span><span>'+n+'</span>'
    +'<a href="#" data-conn="'+esc(m.move_handle)+'">follow in Connect \u2192</a></div>';
}
function verseTree(m,vid,depth,kidsOf,byLabel){
  var h='', par=m.nested_under;
  /* "continues M#" only when the parent is in an EARLIER verse -- a parent in a LATER verse is a
     run-mismatch artifact, and tagging it would mislead. The Move Score's rule, carried over. */
  if(par&&byLabel[par]&&firstVerse(byLabel[par])<vid){
    var pg=(byLabel[par].paraphrase||byLabel[par].operation||'');
    h+='<div class="conttag">\u21b3 continues '+esc(par)+' \u00b7 '+esc(pg.slice(0,40))+(pg.length>40?'\u2026':'')+'</div>';
  }
  h+=moveHTML(m,depth>0);
  var all=kidsOf[m.label]||[], here=all.filter(function(c){return firstVerse(c)===vid;});
  if(here.length){
    var note=(here.length===all.length)
      ? ('\u21b3 '+esc(m.label)+' unpacks into '+all.length+' move'+(all.length===1?'':'s'))
      : ('\u21b3 '+here.length+' of '+esc(m.label)+'\u2019s '+all.length+' sub-moves are here');
    h+='<div class="subgroup"><div class="sublabel">'+note+'</div>'
      +here.map(function(c){return verseTree(c,vid,depth+1,kidsOf,byLabel);}).join('')+'</div>';
  }
  return h;
}
function firstVerse(m){return (m.verse_ids||[])[0];}

function paintMargins(){
  var L=document.getElementById('margL'), R=document.getElementById('margR');

  /* ONE card per VERSE, not per move. A margin column is narrower and shorter than the text it
     hems, so a card per move cannot stay beside its line -- measured at 55 cards, the stacking rule
     pushed some 905px below the verse they claimed, which silently attributes a reading to the wrong
     verse. Marginalia are fewer and denser than the text by their nature; the daf does not gloss
     every clause. So each verse gets at most one card a side, and the moves inside it are named
     within the card. */
  var byVerse={};
  D.moves.items.forEach(function(m){
    var v=(m.verse_ids||[])[0]; if(!v) return;
    (byVerse[v]=byVerse[v]||[]).push(m);
  });

  /* LEFT — Sitz. The PI has reserved this margin for the five kinds of situate; the feed carries
     sitz + paradigm as free text per move, so what is shown is what exists, and the note says the
     rest is pending Method rather than pretending five buckets are here. */
  var lc=Object.keys(byVerse).map(function(v){
    var seen={}, bits=[];
    byVerse[v].forEach(function(m){
      if(m.sitz&&!seen['s'+m.sitz]){seen['s'+m.sitz]=1;bits.push({k:'the world it assumes',t:m.sitz});}
      if(m.paradigm&&!seen['p'+m.paradigm]){seen['p'+m.paradigm]=1;bits.push({k:'the practice',t:m.paradigm});}
    });
    if(!bits.length) return '';
    return '<div class="mcard" data-for="'+esc(v)+'"><span class="mc-v">'+esc(vref(v))+'</span>'
      +bits.map(function(b){return '<span class="mc-k">'+esc(b.k)+'</span><span class="mc-t">'+esc(b.t)+'</span>';}).join('')
      +'</div>';
  }).filter(Boolean);
  L.innerHTML='<p class="marg-h">the world it is in</p>'
    +(lc.length?lc.join(''):'<p class="marg-empty">Nothing situates this text yet.</p>');

  /* RIGHT — what readers made of it: recorded later readers first, then the close readings. */
  var rc=((D.reception||{}).items)||[];
  var recByVerse={};
  rc.forEach(function(r){ var v=(r.verse_ids||[])[0]; if(v)(recByVerse[v]=recByVerse[v]||[]).push(r); });
  var verses=(D.text.verses||[]).map(function(x){return x.verse_id;});
  var rcards=verses.map(function(v){
    var parts=[];
    (recByVerse[v]||[]).forEach(function(r){
      parts.push('<span class="mc-k">'+esc(r.who||r.tradition||'a later reader')+'</span>'
        +'<span class="mc-t">'+esc(r.reading||r.text||r.note||'')+'</span>');
    });
    (byVerse[v]||[]).forEach(function(m){
      if(m.gloss) parts.push('<span class="mc-k">read closely \u00b7 '+esc(m.label)+'</span>'
        +'<span class="mc-t">'+esc(m.gloss)+'</span>');
    });
    if(!parts.length) return '';
    return '<div class="mcard" data-for="'+esc(v)+'"><span class="mc-v">'+esc(vref(v))+'</span>'
      +parts.join('')+'</div>';
  }).filter(Boolean);
  R.innerHTML='<p class="marg-h">what readers made of it</p>'
    +(rcards.length?rcards.join(''):'<p class="marg-empty">No reading of this text is recorded yet.</p>');

  [].forEach.call(document.querySelectorAll('.mcard'),function(c){
    c.onclick=function(){ var v=c.getAttribute('data-for'); if(v) selectVerse(v); };
  });
}

/* Marginalia sit BESIDE the line they read — that is what makes them marginalia rather than a
   sidebar with a long list in it. So each card is placed at its verse's own vertical position, and
   when two cards would overlap the second slides down to clear the first (the classic margin-note
   stacking rule). Recomputed on resize and whenever the center reflows, because a card that has
   drifted from its line is worse than no card: it silently attributes a reading to the wrong verse. */
function alignMargins(){
  if(window.innerWidth<1180){                     /* stacked layout: no alignment to do */
    [].forEach.call(document.querySelectorAll('.mcard'),function(c){c.style.position='';c.style.top='';});
    return;
  }
  ['margL','margR'].forEach(function(id){
    var host=document.getElementById(id); if(!host) return;
    var hostTop=host.getBoundingClientRect().top, last=-1e9;
    [].forEach.call(host.querySelectorAll('.mcard'),function(c){
      var v=c.getAttribute('data-for');
      var el=v?document.querySelector('.v[data-verse="'+v+'"]'):null;
      if(!el){ c.style.position=''; c.style.top=''; return; }
      var want=el.getBoundingClientRect().top-hostTop;
      var top=Math.max(want, last+8);
      c.style.position='absolute'; c.style.top=top+'px'; c.style.left='0'; c.style.right='0';
      last=top+c.offsetHeight;
    });
    host.style.height=Math.max(0,last+40)+'px';
  });
}
var _alignT=null;
function scheduleAlign(){ clearTimeout(_alignT); _alignT=setTimeout(alignMargins,60); }
window.addEventListener('resize',scheduleAlign);

function vref(vid){ var v=(D.text.verses||[]).filter(function(x){return x.verse_id===vid;})[0];
  return v?String(D.text.ref)+':'+v.n:''; }

/* ── the whole passage, as bars (ported from the Move Score) ─────────────────────────────────── */
function paintArc(){
  /* the Move Score's arc, with what my first port dropped: colour marks WHICH TEXT a verse is from,
     the beats are named, and the key says what the colours mean. On Mark 16 that is not decoration --
     the provenance split at 16:8 is the central fact of the chapter, and a monochrome bar hides it. */
  var vs=D.text.verses||[], mx=1;
  var counts=vs.map(function(v){ var n=movesForVerse(v.verse_id).length; if(n>mx)mx=n; return n; });
  document.getElementById('arc').innerHTML=
    '<p class="arc-h">the whole passage</p>'
   +'<p class="arc-how">each bar is a verse \u2014 taller means more moves happen in it; colour marks which text it\u2019s from. click a bar to jump.</p>'
   +'<div class="arc-bars">'+vs.map(function(v,k){
      return '<button class="ab'+(v.n<=8?'':' c2')+'" data-verse="'+esc(v.verse_id)+'" title="'+esc(D.text.ref)+':'+v.n
        +' \u00b7 '+counts[k]+' move'+(counts[k]===1?'':'s')+'" style="height:'+Math.max(3,Math.round(counts[k]/mx*52))+'px"></button>';
    }).join('')+'</div>'
   +'<div class="arc-beats"><span>anointing &amp; alarm</span><span>the empty tomb</span><span>fear \u00b7 silence</span><span>the added ending</span></div>'
   +'<div class="arc-key"><span class="k f">the earliest text \u00b7 16:1\u20138</span>'
     +'<span class="k t">added by later hands \u00b7 16:9\u201320</span></div>';
  [].forEach.call(document.querySelectorAll('.ab'),function(b){
    b.onclick=function(){ selectVerse(b.getAttribute('data-verse'));
      var el=document.querySelector('.v[data-verse="'+b.getAttribute('data-verse')+'"]');
      if(el) el.scrollIntoView({behavior:'smooth',block:'center'}); };
  });
}

function paintLadder(){
  var i=stepIndex(), st=STEPS[i];
  document.getElementById('ladder').innerHTML=
    '<div class="ladder-r" role="tablist" aria-label="the reading steps">'
    +STEPS.map(function(x,k){
      return '<button class="st'+(k===i?' on':(k<i?' done':''))+'" role="tab" aria-selected="'+(k===i)+'"'
        +' data-step="'+x.id+'"><span>'+(k+1)+' '+esc(x.n)+'</span><span class="stn">'+esc(x.ask)+'</span></button>';
    }).join('')+'</div>'
    +'<p class="ladder-note">'+esc(st.note)+'</p>'
    +(i<STEPS.length-1
       ? '<button class="ladder-next" data-next="'+STEPS[i+1].id+'">then \u2192 '+esc(STEPS[i+1].n)+' \u00b7 '+esc(STEPS[i+1].ask)+'</button>'
       : '');
  [].forEach.call(document.querySelectorAll('.st'),function(b){
    b.onclick=function(){ setStep(b.getAttribute('data-step')); };
  });
  var nx=document.querySelector('.ladder-next'); if(nx) nx.onclick=function(){ setStep(nx.getAttribute('data-next')); };
  document.body.setAttribute('data-step', st.id);
}

function setStep(id){
  keepingPlace(function(){
    S.step=id;
    var st=STEPS[stepIndex()];
    /* stepping BACK closes a layer that step no longer offers, so the room never shows a panel
       the current step has not earned. Stepping forward opens that step's lens on the current
       selection, which is what makes the change visible rather than merely available. */
    if(!st.lens){ S.lens=null; S.move=null; closePanels(); }
    else if(S.verse){ S.lens=st.lens; open(); }
    paintLadder(); paintRail(); paintText(); scheduleAlign();
  }, S.verse);
}

function closePanels(){
  document.body.classList.remove('open');
  var a=document.getElementById('aside'); if(a) a.innerHTML='';
}

function stepIndex(){ var i=STEPS.map(function(x){return x.id;}).indexOf(S.step); return i<0?0:i; }

function paintText(){
  var lit=S.verse?[S.verse]:[];
  if(S.move){var m=moveByHandle(S.move); if(m) lit=m.verse_ids;}
  [].forEach.call(document.querySelectorAll('.v'),function(el){
    el.classList.toggle('lit', lit.indexOf(el.getAttribute('data-verse'))>=0);
  });
}

/* paintChips() is DELETED. It rendered a pill under the selected verse ("M1 buy") whose click
   opened the SEE drawer on the right -- which is the "move pops to the right" the PI objected to,
   and it survived the daf rebuild because I added the inline move without removing the old path.
   The move is on the page now; a pill that opens a panel containing the same move is not a second
   affordance, it is a second copy. */

function buildText(){
  var t=D.text;
  var edName=String(t.edition||'').replace(/^The\s+/,'').replace(/\s*\([^)]*\)\s*:.*$/,'');   /* "The World English Bible (WEB): Mark" -> "World English Bible" */
  document.getElementById('ed').textContent=edName+' · '+String(t.rights_status||'').replace(/_/g,' ');
  var BY={}, KIDS={};
  D.moves.items.forEach(function(m){ BY[m.label]=m; });
  D.moves.items.forEach(function(m){ if(m.nested_under)(KIDS[m.nested_under]=KIDS[m.nested_under]||[]).push(m); });
  document.getElementById('text').innerHTML=t.verses.map(function(v){
    var body=esc(v.text);
    (v.apparatus||[]).forEach(function(a){                       /* apparatus stays, marked */
      body=body.split(esc(a.mark)).join('<span class="app" title="translator apparatus, carried verbatim from the edition — the brace marking is the edition\u2019s own">'+esc(a.mark)+'</span>');
    });
    /* top-level moves only at this level; the component nests its own children */
    var mine=movesForVerse(v.verse_id).filter(function(m){
      return !m.nested_under || !BY[m.nested_under] || firstVerse(BY[m.nested_under])!==v.verse_id; });
    var prov=(v.n<=8?' orig':' added');
    return '<p class="v'+prov+'" data-verse="'+esc(v.verse_id)+'" tabindex="0"><span class="vn">'+v.n+'</span>'+body+'</p>'
      +mine.map(function(m){return verseTree(m,v.verse_id,0,KIDS,BY);}).join('');
  }).join('');
  /* the component discloses itself in place -- "see how" opens the anatomy under the paraphrase,
     which is the Move Score's gesture. Clicking a move selects it too, so the margins and the arc
     stay aligned with what is being read. */
  [].forEach.call(document.querySelectorAll('.mv > .para'),function(pa){
    pa.onclick=function(e){ e.stopPropagation();
      var mv=pa.parentElement, wasOpen=mv.classList.contains('open');
      keepingPlace(function(){
        mv.classList.toggle('open', !wasOpen);
        pa.querySelector('.exp').innerHTML = wasOpen ? 'see how \u203a' : 'hide \u2039';
      }, S.verse);
      selectMove(mv.getAttribute('data-mv'));
      scheduleAlign();
    };
  });
  [].forEach.call(document.querySelectorAll('[data-conn]'),function(a){
    a.onclick=function(e){e.preventDefault();e.stopPropagation();
      selectMove(a.getAttribute('data-conn')); showLens('connect');};
  });
  [].forEach.call(document.querySelectorAll('.v'),function(el){
    el.onclick=function(){selectVerse(el.getAttribute('data-verse'));};
    el.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();selectVerse(el.getAttribute('data-verse'));}};
  });
}

/* ══ SELECT ONCE -> ALIGN EVERYWHERE ══ */
/* Selecting a verse MARKS it — it lights the line, aligns the margins, and nothing else. It used to
   force S.lens='see' and open the drawer, which meant a click on READ swung open a panel the step
   had not earned, directly contradicting the step's own sentence ("nothing else is on screen yet").
   A gate that any click can walk through is not a gate. A reader opens a lens by choosing a lens. */
function selectVerse(vid){
  var same=(S.verse===vid);
  S.verse=vid; S.move=null;
  var ms=movesForVerse(vid); if(ms.length) S.move=ms[0].move_handle;
  keepingPlace(function(){
    paintText();
    /* Clicking the VERSE unfolds its moves. The anatomy used to open only from the small "see how"
       on the move itself, or by jumping from the bar at the top -- so the obvious gesture, clicking
       the line you are reading, did nothing visible. Clicking again folds it back, which is the
       same affordance in reverse rather than a second one to learn. */
    var mvs=movesFor(vid), anyOpen=mvs.some(function(el){return el.classList.contains('open');});
    mvs.forEach(function(el){
      var want = same ? !anyOpen : true;
      el.classList.toggle('open', want);
      var x=el.querySelector('.exp'); if(x) x.innerHTML = want ? 'hide \u2039' : 'see how \u203a';
    });
    if(document.body.classList.contains('open')) paintAside();
  }, vid);
  scheduleAlign();
}
function movesFor(vid){
  var host=document.querySelector('.v[data-verse="'+vid+'"]'), out=[];
  for(var n=host&&host.nextElementSibling; n && !n.classList.contains('v'); n=n.nextElementSibling){
    if(n.classList.contains('mv')) out.push(n);
    [].push.apply(out, [].slice.call(n.querySelectorAll('.mv')));
  }
  return out;
}
/* MARKING a move is not OPENING a panel about it. The move's own anatomy is on the page, under its
   paraphrase, so selecting one only needs to align the margins and the arc with what is being read.
   The old selectMove() called open(), which is why clicking a move made it "pop to the right" -- the
   reader was shown a drawer containing the thing they had just clicked on. openMove() is kept for
   the places that genuinely want the drawer (the arc's jump-to, a cross-reference from Connect). */
function selectMove(h){ var m=moveByHandle(h); if(!m)return;
  S.move=h; if(m.verse_ids.length) S.verse=m.verse_ids[0];
  keepingPlace(function(){ paintText(); if(document.body.classList.contains('open')) paintAside(); }, S.verse); }
function openMove(h){ selectMove(h); if(!S.lens) S.lens='evidence'; open(); }
function showLens(id){ S.lens=id; open(); }
/* Wide layout: the rail and the panel are absolutely placed, so opening one costs no layout.
   Narrow layout: the rail joins the flow and would push the text down by its own height. Both cases
   are covered by compensating around the whole mutation rather than around any one part of it. */
function open(){ keepingPlace(function(){
  document.body.classList.add('open'); paintText(); paintRail(); paintAside(); }, S.verse); }

/* ══ CLOSE -> ORDINARY READING, SAME PLACE.  Only classes + a transform change, so the
      document never reflows and the scroll offset is untouched. ══ */
function closeAll(){
  keepingPlace(function(){
    S.verse=null; S.move=null; S.lens=null;
    document.body.classList.remove('open');
    paintText();
    document.getElementById('rail').innerHTML='';
    document.getElementById('aside').innerHTML='';
  });
}
document.addEventListener('keydown',function(e){ if(e.key==='Escape') closeAll(); });

/* ══ THE RAIL — every lens says, for THIS selection, whether it can answer ══ */
function lensState(id){
  var ms=activeMoves();
  if(id==='see')      return ms.length?{s:'ok'}:{s:'none-here'};
  if(id==='world')    return ms.length?{s:'ok'}:{s:'none-here'};
  if(id==='inherits'){var n=ms.reduce(function(a,m){return a+(m.lineage||[]).length;},0);
                      return n?{s:'ok',mk:n}:{s:'none-here'};}
  if(id==='connect'){ var n=edgesFor(ms).length; return n?{s:'ok',mk:n}:{s:'none-here'};}
  if(id==='compare')  return (S.verse&&D.witnesses.by_verse[S.verse])?{s:'ok',mk:D.witnesses.lanes.length}:{s:'no-join'};
  if(id==='reached')  return (D.witness_chain&&D.witness_chain.this_text)?{s:'text-level'}:{s:'none-here'};
  if(id==='afterlives')return (S.verse===D.reception.anchored_verse_id)?{s:'ok',mk:D.reception.readers.length}:{s:'out-of-scope'};
  if(id==='open')     return {s:'awaiting-method'};
  if(id==='evidence') return {s:'ok'};
  return {s:'ok'};
}
/* A step offers only the lenses it has EARNED. This is the ladder's one real constraint, and it is
   the reason the sequence is a method rather than a suggestion: showing RESPOND's readings while the
   reader is still on READ would hand them someone else's question before they have their own.
   EVIDENCE is exempt -- where a thing came from is never a spoiler, and a reader who distrusts the
   page must be able to check it at any point. */
function lensesForStep(){
  var earned={}, i=stepIndex();
  STEPS.slice(0, i+1).forEach(function(x){
    if(x.lens) earned[x.lens]=1;
    (x.unlocks||[]).forEach(function(k){ earned[k]=1; });
  });
  /* EVIDENCE from UNPACK on, not from READ. "Where is this from?" needs a claim to point at, and at
     READ there is not one yet -- the only provenance in play is the text's own, and the header
     already carries it (edition + rights, in view the whole time). Offering the lens at READ asked a
     question the step has not raised, which is what made the rail feel like it belonged to a
     different page. From UNPACK there is a reading on screen, and the question becomes real. */
  if(i>0) earned['evidence']=1;
  return LENSES.filter(function(L){ return earned[L.id]; });
}

/* ONE MENU, and it is the ladder. The lens rail used to float in the left margin -- which is Sitz's
   column, so the two overlapped -- and at READ it offered "ask of it: EVIDENCE, where is this from?",
   which is not the question READ asks. Two navigations in two places, neither explaining the other.
   The lenses that are not steps now sit as a quiet row beneath the ladder: same place, same moment,
   subordinate to the step. */
function paintRail(){
  var ls=lensesForStep();
  document.getElementById('rail').innerHTML=ls.length?('<div class="rail-in">'+
   ls.map(function(L){
     var st=lensState(L.id);
     var tip=st.s==='ok'?'':STATES[st.s];   /* the rail says WHY a lens is quiet, not merely that it is */
     return '<button class="lens'+(S.lens===L.id?' on':'')+'" data-lens="'+L.id+'" data-state="'+(st.s==='ok'?'':st.s)+'"'
      +(tip?' title="'+esc(tip)+'"':'')+'>'
      +'<span class="q">'+L.q+(st.mk?'<span class="mk">'+st.mk+'</span>':'')+'</span></button>';
   }).join('')+'</div>'):'';
  [].forEach.call(document.querySelectorAll('.lens'),function(b){
    b.onclick=function(){showLens(b.getAttribute('data-lens'));};
  });
}

function edgesFor(ms){
  var set={}; ms.forEach(function(m){set[m.move_handle]=1;});
  return D.connect.edges.filter(function(e){
    return e.from.some(function(x){return set[x];}) || e.to.some(function(x){return set[x];});
  });
}

/* ══ THE OPEN LENS ══ */
function paintAside(){
  var L=LENSES.filter(function(x){return x.id===S.lens;})[0]; if(!L) return;
  var v=verseById(S.verse), m=S.move?moveByHandle(S.move):null;
  var head='<div class="a-top"><span class="a-q">'+L.q+'</span>'
    +'<button class="a-x" id="ax" title="close (Esc)">✕</button></div>'
    +'<p class="a-sub">'+esc(L.n)+(v?' · '+esc(v.ref):'')+(m?' · '+esc(m.label):'')+'</p>';
  var body=({see:lensSee,connect:lensConnect,world:lensWorld,inherits:lensInherits,
             compare:lensCompare,reached:lensReached,afterlives:lensAfterlives,
             open:lensOpen,evidence:lensEvidence}[S.lens])(v,m);
  document.getElementById('aside').innerHTML='<div class="aside-in">'+head+body+'</div>';
  var x=document.getElementById('ax'); if(x) x.onclick=closeAll;
  [].forEach.call(document.querySelectorAll('[data-goto-move]'),function(b){
    b.onclick=function(){openMove(b.getAttribute('data-goto-move'));};
  });
  /* the diagram is optional -- the labeled line reads as language by default (the Move Score's rule) */
  [].forEach.call(document.querySelectorAll('.asdiagram'),function(b){
    b.onclick=function(ev){ ev.stopPropagation();
      var d=b.nextElementSibling, hid=d.hasAttribute('hidden');
      if(hid){d.removeAttribute('hidden');b.textContent='hide diagram';b.setAttribute('aria-expanded','true');}
      else{d.setAttribute('hidden','');b.textContent='show as diagram';b.setAttribute('aria-expanded','false');}
    };
  });
}

/* SEE — the move grammar (Method fact, plane A; rendered, never re-derived) */
/* ONE definition of the move's grammar, used by the inline move under the verse AND by the SEE
   drawer — extracted rather than copied, because two copies of a rendering is how the labeled line
   and the diagram diverged in the first place. */
function grammar(m){
  /* plain word leads, the coded field follows in parens (Fidelity: the term is present, not replaced) */
  var rl=[];
  if(m.agent)     rl.push('<span><b class="rl">who <span class="rterm">(agent)</span></b>'+esc(m.agent)+'</span>');
                  rl.push('<span><b class="rl">does <span class="rterm">(operation)</span></b>'+esc(m.operation||m.move_type||'')+'</span>');
  if(m.substrate) rl.push('<span><b class="rl">on <span class="rterm">(substrate)</span></b>'+esc(m.substrate)+'</span>');
  if(m.outcome)   rl.push('<span><b class="rl">result <span class="rterm">(outcome)</span></b>'+esc(m.outcome)+'</span>');
  var dia='<div class="gram" style="margin:0"><div class="g-row">'
      +'<div class="g-box"><span class="g-t">who</span><span class="g-v">'+esc(m.agent||'—')+'</span></div>'
      +'<div class="g-op"><span class="arw">→</span><span class="opn">'+esc(m.operation||'')+'</span><span class="arw">→</span></div>'
      +'<div class="g-box"><span class="g-t">what results</span><span class="g-v">'+esc(m.outcome||'—')+'</span></div>'
    +'</div>'
    +(m.substrate?'<div class="g-box" style="margin-top:.32rem"><span class="g-t">upon</span><span class="g-v">'+esc(m.substrate)+'</span></div>':'')
    +'</div>';
  return '<div class="gram">'
    +'<div class="roleline">'+rl.join('')+'</div>'
    +'<button class="asdiagram" data-dia="1" aria-expanded="false">show as diagram</button>'
    +'<div class="dia-wrap" hidden>'+dia+'</div>'
    +'<p class="g-meta">'+esc(m.voice||'')+' · '+esc(m.move_type||'')
      +(m.nested_under?' · nested under '+esc(m.nested_under):'')+'<br>told by '+esc(m.narrator||'—')+'</p></div>';
}

function lensSee(v,m){
  if(!m) return state('none-here','No move is coded on this verse.',
    'the coded set is '+D.moves.items.length+' moves across '+D.text.ref+':'+D.text.verses[0].n+'\u2013'+D.text.verses[D.text.verses.length-1].n);
  var af=D.account_frame.values||{}, veer=0, rawN=0;
  var ribbon=Object.keys(af).sort().map(function(a){
    var fp=(m.frame_permove||{})[a], isV=(fp!=null&&fp!==af[a]); if(isV)veer++;
    var raw=(fp!=null && !isGlossed(a,fp));
    if(raw) rawN++;
    var aGloss=isGlossed(a,'')?axLabel(a):'';                    /* the axis's own reader phrase, if written */
    var vGloss=raw?'':valLabel(a,fp);                            /* the value's, if written */
    var vTerm=(fp==null)?'—':hum(fp);                            /* the method's word, always shown */
    return '<div class="ax'+(isV?' veer':'')+'">'
      +'<span class="an"><b class="term">'+esc(a)+'</b>'
        +(aGloss?'<span class="gl">'+esc(aGloss)+'</span>':'')+'</span>'
      +'<span class="av"><b class="term">'+esc(vTerm)+'</b>'
        +(vGloss?'<span class="gl">'+esc(vGloss)+'</span>':'')
        +(isV?'<span class="base">'+esc(hum(af[a]))+'</span>':'')+'</span></div>';
  }).join('');
  var d='';
  if(m.frame_delta_axis&&m.frame_delta_from!=null&&m.frame_delta_to!=null){
    var ax=m.frame_delta_axis;
    d='<p class="h">what shifted from the move before</p><p class="p">'
      +'<b>'+esc(ax)+'</b>'+(isGlossed(ax,'')?' <span class="dim">'+esc(axLabel(ax))+'</span>':'')+'<br>'
      +esc(hum(m.frame_delta_from))+' <span class="sh">\u2192</span> <b>'+esc(hum(m.frame_delta_to))+'</b></p>';
  }
  return grammar(m)
    +(m.paraphrase?'<p class="h">the move, restated</p><p class="gloss">'+esc(m.paraphrase)+'</p>'
        +'<p class="a-anchor" style="margin-top:-.15rem">Hold this against the verse above: it is what the coder took the move to be, worded so you can disagree.</p>':'')
    +(m.gloss?'<p class="h">what it is doing, read closely</p><p class="gloss">'+esc(m.gloss)+'</p>'
        +'<p class="a-anchor" style="margin-top:-.15rem">A reading, not a restatement \u2014 this one interprets.</p>':'')
    +'<p class="h">the frame — '+(veer?veer+' of 8 axes veer from this account':'holds the account baseline')+'</p>'+ribbon+d
    /* today this is 8 of 8 on every move — value_gloss says so itself: 8 filled, 279 pending, and all 8
       filled entries are the axis NAMES. Worded so the all-raw case reads as a state of the work rather
       than as a broken panel, and so it updates itself as Content SB fills entries in. */
    +(rawN? '<p class="a-anchor">'+(rawN===8
        ? 'Each axis is named in the method\u2019s own word, with the plain meaning beneath it. The values have no plain wording written for them yet, so they appear as the method\u2019s word alone.'
        : rawN+' of these 8 values have no plain wording written for them yet, so they appear as the method\u2019s word alone.')+'</p>' : '')
    +anchorNote('Tied to this verse by the verse numbers the coder recorded. Every field above comes from the coded export \u2014 nothing on this panel was inferred here \u2014 but the two sentences are different kinds: one restates the move, one interprets it, and they are labelled apart.');
}

/* CONNECT — the typed edges (no edge_id upstream, so an edge is shown, not selectable) */
function lensConnect(v,m){
  var ms=activeMoves(), es=edgesFor(ms);
  var bites=es.some(function(e){return !e.resolves;});
  var drift=(bites&&D.connect.drift_note)?state('defect',esc(D.connect.drift_note),
      'reported to the method; the unresolvable endpoints are marked above rather than dropped'):'';
  if(!es.length) return state('none-here','This move links to no other move in the coded set of links.',
      D.connect.count+' links are recorded across the text');
  return es.map(function(e){
    var mine=ms.some(function(x){return e.from.indexOf(x.move_handle)>=0;});
    var other=(mine?e.to_labels:e.from_labels).join(' + ');
    var bad=!e.resolves;
    return '<button class="row"'+(bad?'':' data-goto-move="MARK-16:'+esc((mine?e.to_labels:e.from_labels)[0])+'"')+'>'
      +'<span class="rt">'+(mine?'→ ':'← ')+esc(other)+(bad?' <span class="dim">(not in the coded set)</span>':'')+'</span>'
      +'<span class="rm">'+esc(e.type)+' · '+esc(e.edge_kind)+' · '+esc(e.confidence)+' confidence</span></button>';
  }).join('')+drift
   +anchorNote('Links are recorded between moves, so they follow whichever move you have selected. A link cannot yet be selected in its own right — the method does not give each one a name.');
}

/* WORLD — sitz + paradigm (move-grain), plus the account-level frame declared text-level */
function lensWorld(v,m){
  if(!m) return state('none-here','No move is coded on this verse, so no world-conditions are attached here.','');
  var af=D.account_frame.values||{};
  return '<p class="h">the conditions it arose in</p><p class="p">'+esc(m.sitz||'—')+'</p>'
    +'<p class="h">the practice it belongs to</p><p class="p">'+esc(m.paradigm||'—')+'</p>'
    +'<p class="h">the account it sits in</p>'
    +state('text-level','<b>'+esc(valLabel('telos',af.telos))+'</b> · '+esc(valLabel('epistemic-warrant',af['epistemic-warrant']))
      +' · '+esc(valLabel('hermeneutic-posture',af['hermeneutic-posture'])),
      'the account frame is coded once for the whole of Mark 16, not per verse — the SEE lens shows where this move veers from it')
    +anchorNote('The conditions and the practice are recorded for each move, and reach this verse through the move you have selected.');
}

/* INHERITS — lineage.  An empty answer here is Method's own finding, in Method's words. */
function lensInherits(v,m){
  var ms=activeMoves(), cells=[];
  ms.forEach(function(x){(x.lineage||[]).forEach(function(l){cells.push({m:x,l:l});});});
  if(!cells.length){
    var mt=D.lineage.metrics||{};
    return state('none-here','This move stands on no source — and most do not. That is correct, not missing data.',
      'across Mark 16, '+Math.round((mt.upstream_coverage||0)*100)+'% of moves carry an upstream source ('
      +D.lineage.cells.length+' lineage cells over '+D.moves.items.length+' moves)')
      +anchorNote('What a move draws on is recorded move by move. The sentence above is the method’s own wording, not a gloss written for this page.');
  }
  return cells.map(function(c){
    var full=D.lineage.cells.filter(function(z){return z.move_handle===c.m.move_handle&&z.source===c.l.source_ref;})[0]
          || D.lineage.cells.filter(function(z){return z.move_handle===c.m.move_handle;})[0] || {};
    return '<div class="row"><span class="rt">'+esc(c.l.source_ref||full.source||'—')+'</span>'
      +'<span class="rm">'+esc([c.l.vehicle||full.vehicle,c.l.certainty||full.link_certainty,full.family].filter(Boolean).join(' · '))+'</span>'
      +((c.l.seam||full.seam)?'<span class="rs">'+esc(c.l.seam||full.seam)+'</span>':'')+'</div>';
  }).join('')+anchorNote('What a move draws on is recorded move by move. The open question under each source is the method’s, quoted as written.');
}

/* COMPARE — the one comparison that genuinely joins on verse_id, plus the one that does not */
function lensCompare(v,m){
  var cg=D.cross_gospel;
  var noJoin=state('no-join',
    'The four gospels are compared as <b>'+cg.beats.length+' narrative beats</b>, not verse by verse — so no beat can be lined up against '+esc(v?v.ref:'this verse')+' yet.',
    cg.seam_reader||'');
  var w=S.verse&&D.witnesses.by_verse[S.verse];
  if(!w) return noJoin;
  /* Each witness's unit-count for THIS verse, shown beside it. The four are lined up at the verse and at
     no finer grain — they agree on how a verse divides in only 5 of 20 — so showing four lanes flush
     without saying so would imply a correspondence the editions do not support. */
  var lanes=D.witnesses.lanes.map(function(l){
    var blocks=(w.lanes||{})[l.key]||[];
    if(!blocks.length) return '';
    var u=(w.units_per_witness||{})[l.key];
    return '<div class="lane"><span class="ln">'+esc(l.label)+'</span><span class="ld">'+esc(l.date||'')+'</span>'
      +(u?'<span class="ld">· '+u+(u===1?' part':' parts')+'</span>':'')
      +'<div class="lt">'+esc(blocks.join(' '))+'</div></div>';
  }).join('');
  var spreadNote = (w.spread>0)
    ? state('text-level','They do not divide this verse alike — '
        +D.witnesses.lanes.map(function(l){var u=(w.units_per_witness||{})[l.key];
            return u?esc(l.label)+' '+u:null;}).filter(Boolean).join(' · ')
        +'. So they are lined up here <b>at the verse</b>, and the parts within it do not correspond.',
        D.witnesses.grain_note_reader)
    : '';
  return '<p class="h">the same verse in four witnesses</p>'+lanes+spreadNote
    +(w.variance!=null?'<p class="h">how far apart they run</p><p class="p"><b>'+w.variance+'</b> composite variance'
      +((w.glossa&&w.glossa.note)?' <span class="dim">— '+esc(w.glossa.note)+'</span>':'')+'</p>':'')
    +'<p class="h">across the four gospels</p>'+noJoin
    +anchorNote('The four translations are recorded verse by verse, so they line up with what you selected — '
       +'but only at the verse: across Mark 16 they agree on how a verse divides in just '
       +D.witnesses.verses_where_all_witnesses_agree+' of '+D.witnesses.verses_total+'. '
       +'The comparison across the four gospels is not recorded that way at all — see above.');
}

/* REACHED US — witness / transmission. The one lens whose danger is entirely in how it is drawn.
   IRR231 is unanimous that these degrees are a reconstruction MODEL, not a measurement, and the feed's own
   design brief says the reconstruction-vs-explicit-in-source asymmetry must be unavoidable. So: the number
   never leads, it never appears without the word "reconstruction" beside it, and what it rests on is shown
   next to it. A degree drawn as a clean integer beside a claim reads as a count of real hops — which is
   exactly the vote-count-becomes-truth failure the Panel refuses, one output over. */
function lensReached(v,m){
  var W=D.witness_chain, me=W&&W.this_text;
  if(!me) return state('none-here','No transmission reconstruction is recorded for this text.','');
  var lo=me.degree_range[0], hi=me.degree_range[1];
  var span=(lo===hi)?String(lo):(lo+'–'+hi);
  var tops=Object.keys(me.per_topology||{});
  return '<p class="h">how far this text stands from what it reports</p>'
    +'<div class="st st-text-level"><span class="stl">a reconstruction, not a count</span>'
    +'<b>'+esc(span)+' removes</b> under '+tops.length+' different scholarly pictures of who copied whom'
    +(me.degree_stable?' — and the same under each of them.':' — and it differs between them.')
    +'<span class="why">'+esc(W.reader_caveat)+'</span></div>'
    +'<p class="h">what that rests on</p>'
    +'<p class="p">'+esc(me.load_bearing_edge||'—')+'<br><span class="dim">remove that one link and the '
    +'estimate moves — it is the load-bearing step, not one among equals.</span></p>'
    +(me.tradition_antiquity?'<p class="h">how early the tradition is</p><p class="p">'
      +esc(me.tradition_antiquity.est||'')+(me.tradition_antiquity.note?'<br><span class="dim">'
      +esc(me.tradition_antiquity.note)+'</span>':'')+'</p>':'')
    +'<p class="h">the other witnesses, on the same reconstruction</p>'
    +W.others.map(function(o){
       var r=(o.degree_range[0]===o.degree_range[1])?String(o.degree_range[0])
             :(o.degree_range[0]+'–'+o.degree_range[1]);
       return '<div class="row"><span class="rt">'+esc(o.key.replace(/-/g,' '))+'</span>'
         +'<span class="rm">'+esc(r)+' removes · '+esc(String(o.evidence_status).replace(/-/g,' '))+'</span></div>';
     }).join('')
    +'<p class="h">where it is contested</p>'
    +'<p class="p">'+esc(W.contested||'—')+'</p>'
    +state('awaiting-method','That these texts hold the same order under different scholarly pictures is '
      +'agreement among scholars — not proof of how the texts actually descended.',
      W.circularity_note)
    +anchorNote('This describes the whole of Mark, not the verse you selected — it is one estimate for the '
      +'text as a text. Every figure here is a modern reconstruction; where a tradition records its own '
      +'chain of transmitters instead, that is a different kind of claim and is never merged with these.');
}

/* AFTERLIVES — reception, coded for the end-silence only; elsewhere that is said plainly */
function lensAfterlives(v,m){
  var R=D.reception;
  if(!v||v.verse_id!==R.anchored_verse_id){
    return state('out-of-scope','Later readers are coded for one place in this chapter — the end-silence at <b>Mark 16:8</b>.',
      'select 16:8 to read them. Reception is not yet coded verse by verse across Mark 16.')
      +'<p class="deeper">→ <a href="reception.html">the reception map</a></p>';
  }
  return '<p class="h">'+esc(R.center&&R.center.label||R.gap)+'</p>'
    +(R.center?'<p class="gloss">'+esc(R.center.reading)+'</p>':'')
    +'<p class="h">'+R.readers.length+' later readers</p>'
    +R.readers.map(function(r){
      return '<div class="row"><span class="rt">'+esc(r.label)+'</span>'
        +'<span class="rm">'+esc(r.grounding||'')+(r.source_id?' · '+esc(r.source_id):'')+'</span>'
        +(r.reading?'<span class="rs">'+esc(r.reading)+'</span>':'')+'</div>';
    }).join('')
    +state('no-join','These readers are attached to the end-silence by a written note rather than by a verse number.',
      'so they can be shown here, at 16:8, but they cannot yet follow you to any other verse.')
    +anchorNote('These readers are attached to the end-silence by a written note rather than a verse number, so they appear at 16:8 and nowhere else.');
}

/* OPEN — the absence slot.  Method S180 adjudicated the ontology, and one ruling corrected what this
   lens shipped earlier: the silence at 16:8 is NOT an absence. It is content — the text says the women
   said nothing — so it is a coded move and is marked as a move. Keeping it here beside lineage-absence
   would assert that the evangelist's silence and our not-having-coded-something are the same kind of
   object. They are not; the resemblance is in the English word. (RULING 3.) */
function lensOpen(v,m){
  var A=D.absence;
  var typed=A.typed_now.map(function(t){
    return '<div class="row"><span class="rt">'+esc(t.claim)+'</span>'
      +'<span class="rm">'+esc(t.kind)+(t.count!=null?' · '+t.count+' of '+t.of+' moves':'')+'</span></div>';
  }).join('');
  /* the four KINDS, and how far each one currently reaches — the shape of the lens, honestly drawn */
  var kinds=(A.axis_b_kinds||[]).map(function(k){
    return '<div class="row"><span class="rt">'+esc(k.kind)+(k.reaches_a_feed?'':' <span class="dim">— recorded, but reaches no reading yet</span>')+'</span>'
      +'<span class="rm">'+k.rows+' recorded</span></div>';
  }).join('');
  /* at 16:8 this is the most interesting thing on the panel, so lead with it there */
  var NA=A.not_an_absence;
  var naBlock=NA?('<p class="h">what is <em>not</em> an absence here</p>'
      +'<div class="st st-none-here"><span class="stl">content, not a gap</span>'
      +esc(NA.ruling)+'<span class="why">'+esc(NA.case+' — shown instead as '+NA.shown_as)+'</span></div>'):'';
  var atEnd = v && NA && /16:8/.test(NA.case) && v.verse_id===(D.reception&&D.reception.anchored_verse_id);
  return (atEnd?naBlock:'')
    +'<p class="h">what the method has named, for this move</p>'+typed
    +'<p class="h">the kinds of absence, and how far each reaches</p>'+kinds
    +(atEnd?'':naBlock)
    +'<p class="h">still open</p>'
    +state('awaiting-method','The open ring carries one thing — whether a slot was tested. Which <em>kind</em> of absence it is needs a second, separate mark, and that mark has not been drawn yet.',
      'waiting on: '+(A.awaiting_reader||A.awaiting).join(' · ')+'.')
    +anchorNote('Only absences the method has already named appear here, and the visual grammar for the second channel has not been invented on this page.');
}

/* EVIDENCE — where every proposition on screen came from */
function lensEvidence(v,m){
  var t=D.text, g=t.gate||{};
  var lensSrc={see:'moves',connect:'connect',world:'moves',inherits:'lineage',compare:'witnesses',
               reached:'witness',afterlives:'reception',open:'moves',evidence:'text'};
  return '<p class="h">this text</p>'
    +'<p class="p"><b>'+esc(t.edition)+'</b><br>'+esc(t.source_id)+' · '+esc(String(t.rights_status).replace(/_/g,' '))
      +' · fidelity '+esc(t.current_fidelity)+'</p>'
    +(v?'<p class="h">this verse</p><p class="p">'+esc(v.ref)+' · <span class="dim">'+esc(v.verse_id)+'</span>'
      +(v.passage_id?'<br>passage '+esc(v.passage_id):'')+'</p>':'')
    +'<p class="h">the package</p>'
    +'<p class="p">'+esc(t.checkout_version)+'<br><span class="dim" style="font-family:var(--mono);font-size:.62rem;word-break:break-all">'+esc(t.package_hash)+'</span></p>'
    +'<p class="h">gates</p><p class="p">'
      +Object.keys(g).map(function(k){return (g[k]?'✓ ':'✕ ')+hum(k);}).join(' · ')+'</p>'
    +'<p class="h">what each lens reads</p>'
    +'<p class="p">'+LENSES.filter(function(L){return L.id!=='evidence';}).map(function(L){
        var src=String((D._sources||{})[lensSrc[L.id]]||'—').replace(/\s*\(plane [A-D]\)/,'');
        return '<b>'+L.q+'</b> — '+esc(src.split('/').pop());}).join('<br>')+'</p>'
    +'<p class="h">which reading of the text</p>'
    +(D.coded_run.recorded
       ? '<p class="p"><b>'+esc(D.coded_run.run_tag)+'</b><br>'+D.coded_run.n_moves+' coded moves</p>'
       : state('defect','This page shows a reading of '+D.coded_run.n_moves+' coded moves, and the file it comes from does not say which run produced it.',
               D.coded_run.note))
    +'<p class="h">how far to trust it</p>'
    +(((D._adapter||{}).cited||[]).length
        ? ((D._adapter||{}).cited||[]).map(function(c){
            return state('awaiting-method', esc(c.fact),
              esc(c.authority)+' \u2014 Design cannot read this from its own inputs, so it is cited '
              +'rather than derived. It stops being cited when '+esc(c.expires_when)+'.');
          }).join('')
        : '<p class="p dim">nothing on this page is cited rather than derived.</p>')
    +(D.reliability?'<p class="h">how stable is this reading?</p>'
        +state('awaiting-method',esc(D.reliability.disposition),D.reliability.why_no_number):'')
    +'<p class="h">the text itself</p>'
    +'<p class="p">'+esc(t.extraction||'')+'</p>'
    +(D.connect.drift_note?'<p class="h">declared defects in the feed</p>'
        +state('defect',esc(D.connect.drift_note),'shown here so it is disclosed on every verse, and marked in place wherever it actually bites'):'')
    +'<p class="deeper">→ <a href="/engine/method-schema.html">the method</a> · <a href="/engine/library-schema.html">the library</a> · <a href="all.html">every reading-room surface</a></p>';
}

function anchorNote(s){return '<p class="a-anchor">'+esc(s)+'</p>';}

/* ── status pill: derived from the Design State Registry, never hand-typed (rule 8) ── */
function derive(s){
  if(!s) return {label:'—',cls:'na'};
  var d=s.deployment,i=s.implementation,o;
  if(d==='live'&&i==='built') o={label:'live',cls:'live'};
  else if(d==='live'&&(i==='partial'||s.maturity==='pilot')) o={label:'pilot',cls:'pilot'};
  else if(d==='staging') o={label:'preview',cls:'pilot'};
  else if(d==='offline'&&i==='partial') o={label:'paused',cls:'paused'};
  else if(d==='offline'&&i==='unbuilt') o={label:'planned',cls:'soon'};
  else o={label:(i||'—'),cls:'na'};
  if(s.dependency==='blocked') o.label+=' · blocked';
  return o;
}
